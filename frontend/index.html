<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ctcore</title>
    <script>
      // Aplica o tema antes da pintura (sem flash). Mesma regra de src/theme/theme.ts.
      try {
        var s = null;
        try { s = localStorage.getItem("ctcore-theme"); } catch (e) {}
        var dark = s === "dark" || (s !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
