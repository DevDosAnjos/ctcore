server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # /api é do back-end: nunca devolve arquivo nem o index.html do app.
  location /api/ {
    return 404;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Fallback do SPA.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
