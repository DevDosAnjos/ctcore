        unitId: { type: string, format: uuid }
        feeExempt: { type: boolean, nullable: true }
        feeExemptReason: { type: string, nullable: true }
        secondDueOn: { type: string, format: date, nullable: true }
    EnrollmentConclusionRequest:
      type: object
      required: [modalities]
      properties:
        modalities: { type: array, minItems: 1, items: { $ref: '#/components/schemas/EnrollmentConclusionModality' } }
        units: { type: array, items: { $ref: '#/components/schemas/EnrollmentConclusionUnit' } }
    EnrollmentPreviewModality:
      type: object
      required: [unitId, modalityId, planId, planName, planCents, discountCents, monthlyCents]
      properties:
        unitId: { type: string, format: uuid }
        modalityId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        planName: { type: string }
        planCents: { type: integer, format: int64 }
        discountCents: { type: integer, format: int64 }
        monthlyCents: { type: integer, format: int64 }
    EnrollmentPreviewUnit:
      type: object
      required: [unitId, unitName, dueDay, firstDueOn, toleranceDays, feeCents, feeExempt, feeExemptReason, firstChargeCents, secondDueOn, suggestedSecondDueOn]
      properties:
        unitId: { type: string, format: uuid }
        unitName: { type: string }
        dueDay: { type: integer }
        firstDueOn: { type: string, format: date }
        toleranceDays: { type: integer }
        feeCents: { type: integer, format: int64, description: "Taxa a cobrar, já sem a isenção." }
        feeExempt: { type: boolean }
        feeExemptReason: { type: string, nullable: true }
        firstChargeCents: { type: integer, format: int64 }
        secondDueOn: { type: string, format: date }
        suggestedSecondDueOn: { type: string, format: date }
    ClassWarnings:
      type: object
      required: [studentAge, ageRange, ageOutOfRange, capacity, activeStudents, overCapacity]
      properties:
        studentAge: { type: integer, minimum: 0 }
        ageRange: { allOf: [{ $ref: '#/components/schemas/AgeRange' }], nullable: true, description: Nulo quando a turma não tem faixa. }
        ageOutOfRange: { type: boolean }
        capacity: { type: integer, nullable: true }
        activeStudents: { type: integer, minimum: 0 }
        overCapacity: { type: boolean }
    OpenDebt:
      type: object
      description: RN-MAT-19, cobranças em aberto do aluno nas unidades do pedido (a decisão por cobrança é da #73).
      required: [count, totalCents]
      properties:
        count: { type: integer, minimum: 0 }
        totalCents: { type: integer, format: int64, minimum: 0 }
    EnrollmentPreview:
      type: object
      required: [modalities, units, openDebt]
      properties:
        modalities: { type: array, items: { $ref: '#/components/schemas/EnrollmentPreviewModality' } }
        units: { type: array, items: { $ref: '#/components/schemas/EnrollmentPreviewUnit' } }
        openDebt: { $ref: '#/components/schemas/OpenDebt' }
    EnrollmentCharge:
      type: object
      description: Cobrança criada pela conclusão da matrícula (RN-MAT-05).
      required: [id, type, unitId, dueOn, toleranceDays, amountCents]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [MONTHLY, ENROLLMENT_FEE] }
        unitId: { type: string, format: uuid }
        referenceMonth: { type: string, format: date, nullable: true, description: Primeiro dia do mês de referência; nulo na taxa. }
        dueOn: { type: string, format: date }
        toleranceDays: { type: integer }
        amountCents: { type: integer, format: int64 }
    EnrollmentConcluded:
      type: object
      required: [enrollment, summary, termPending, inviteStatus, charges]
      properties:
        charges: { type: array, items: { $ref: '#/components/schemas/EnrollmentCharge' } }
        enrollment: { $ref: '#/components/schemas/Enrollment' }
        summary: { $ref: '#/components/schemas/EnrollmentPreview' }
        termPending: { type: boolean }
        inviteStatus: { type: string, enum: [SENT, FAILED, MINOR, EXISTING_ACCOUNT, NO_EMAIL] }
    OriginProofStored:
      type: object
      required: [proofKey]
      properties:
        proofKey: { type: string }
    StudentGuardianRow:
      type: object
      required: [guardianId, name, email, phone, financial, access, emailProblem]
      properties:
        guardianId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        financial: { type: boolean }
        access: { type: string, enum: [PENDING, ACTIVE] }
        emailProblem: { type: boolean }
    StudentDetail:
      type: object
      required: [id, registeredUnitId, name, birthDate, minor, postalCode, street, number, complement, district, city, state, cpf, email, phone, gender, referral, emergencyName, emergencyRelationship, emergencyPhone, photoUrl, emailProblem, guardians]
      properties:
        id: { type: string, format: uuid }
        registeredUnitId: { type: string, format: uuid }
        name: { type: string }
        birthDate: { type: string, format: date }
        minor: { type: boolean }
        postalCode: { type: string }
        street: { type: string }
        number: { type: string }
        complement: { type: string, nullable: true }
        district: { type: string }
        city: { type: string }
        state: { type: string }
        cpf: { type: string, nullable: true, description: Só dígitos. }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true, description: Só dígitos. }
        gender: { type: string, nullable: true }
        referral: { type: string, nullable: true }
        emergencyName: { type: string, nullable: true }
        emergencyRelationship: { type: string, nullable: true }
        emergencyPhone: { type: string, nullable: true }
        photoUrl: { type: string, nullable: true }
        emailProblem: { type: boolean }
        guardians:
          type: array
          items: { $ref: '#/components/schemas/StudentGuardianRow' }
    StudentRecord:
      type: object
      description: Os campos `birthDate`, `seals`, `contact`, `cpf`, `address` e `emergency` podem faltar na ficha do Professor.
      required: [id, name, photoUrl, age, minor, ageRange, registeredUnit, guardians]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        photoUrl: { type: string, nullable: true }
        birthDate: { type: string, format: date }
        age: { type: integer, minimum: 0 }
        minor: { type: boolean }
        ageRange:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        registeredUnit:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        seals: { type: array, items: { $ref: '#/components/schemas/StudentSeal' } }
        contact:
          type: object
          required: [phone, email, emailProblem]
          properties:
            phone: { type: string, nullable: true }
            email: { type: string, nullable: true }
            emailProblem: { type: boolean }
        cpf: { type: string, nullable: true, description: Só dígitos. }
        address:
          type: object
          required: [postalCode, street, number, complement, district, city, state]
          properties:
            postalCode: { type: string }
            street: { type: string }
            number: { type: string }
            complement: { type: string, nullable: true }
            district: { type: string }
            city: { type: string }
            state: { type: string }
        emergency:
          type: object
          required: [name, relationship, phone]
          properties:
            name: { type: string, nullable: true }
            relationship: { type: string, nullable: true }
            phone: { type: string, nullable: true }
        guardians:
          type: array
          items:
            type: object
            required: [guardianId, name]
            properties:
              guardianId: { type: string, format: uuid }
              name: { type: string }
              email: { type: string }
              phone: { type: string }
              financial: { type: boolean }
              access: { type: string, enum: [PENDING, ACTIVE] }
              emailProblem: { type: boolean }
    StudentHistoryEntry:
      type: object
      required: [action, at, actor, actorProfile, reason]
      properties:
        action: { type: string, description: 'Código da ação, ex.: student.created.' }
        at: { type: string, format: date-time }
        actor: { type: string, nullable: true }
        actorProfile: { type: string, nullable: true }
        reason: { type: string, nullable: true }
    StudentHistoryList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/StudentHistoryEntry' } }
    PortalStudentCard:
      type: object
      required: [id, name, photoUrl, self]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        photoUrl: { type: string, nullable: true }
        self: { type: boolean, description: Cartão do próprio aluno ("Você"). }
  responses:
    BadRequest:
      description: Dados inválidos (VALIDATION_ERROR) ou requisição ilegível (MALFORMED_REQUEST).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Sem sessão (UNAUTHENTICATED).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Sem permissão (FORBIDDEN).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Não encontrado ou sem acesso (NOT_FOUND).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    MethodNotAllowed:
      description: Método não permitido (METHOD_NOT_ALLOWED).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflito com dado existente (CONFLICT).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    EditConflict:
      description: Outra pessoa alterou os dados depois da leitura; versão do If-Match diferente da atual (EDIT_CONFLICT). Nada é gravado.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PreconditionRequired:
      description: Cabeçalho If-Match ausente ou inválido (PRECONDITION_REQUIRED). Nada é gravado.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UnsupportedMediaType:
      description: Tipo de mídia não suportado (UNSUPPORTED_MEDIA_TYPE).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InternalError:
      description: Erro inesperado (INTERNAL_ERROR).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
