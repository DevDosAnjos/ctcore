openapi: 3.0.3
info:
  title: ctcore API
  version: 0.1.0
  description: |
    Fonte única do contrato da API. Rota nova entra neste arquivo no mesmo PR que a cria.

    Convenções
    - Caminhos em plural e kebab-case (`/class-groups`); JSON em camelCase; enums em UPPER_SNAKE_CASE; ids uuid.
    - Valores em dinheiro: inteiros em centavos, campo com sufixo `Cents` (`amountCents`).
    - Instante: `date-time` ISO-8601 em UTC com `Z`. Data de calendário: `date` (AAAA-MM-DD). O fuso da unidade só vale na exibição.
    - Paginação: `page` (a partir de 1, padrão 1) e `size` (25, 50 ou 100, padrão 25). Valor inválido responde 400 VALIDATION_ERROR, sem ajuste silencioso. A lista responde com o envelope `Page`; cada rota declara `items` por composição (allOf com `Page`).
    - Ordenação: `sort=campo,asc|desc`; cada rota declara a lista de campos permitidos e a ordem estável padrão.
    - Erros: todo erro usa o schema `Error`.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: Entra com e-mail e senha (RN-ACE-10 a RN-ACE-12). Rota pública.
      description: |
        Falha de senha, e-mail desconhecido, convite não aceito e conta desativada dão a mesma resposta (INVALID_CREDENTIALS, 401).
        5 senhas erradas seguidas travam o e-mail por 15 minutos e há limite por IP (TOO_MANY_REQUESTS, 429).
        Desafio recusado: CHALLENGE_FAILED (400), sem contar como senha errada.
        Conta com duas etapas ligadas e senha certa não ganha sessão: recebe `{twoFactorRequired:true, ticket}` e conclui em `POST /auth/login/two-factor` (RN-ACE-17).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200':
          description: Sessão iniciada (cookie SESSION na resposta) ou, com duas etapas ligadas, o bilhete do segundo passo (sem cookie).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionView'
                  - $ref: '#/components/schemas/TwoFactorRequired'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: "E-mail ou senha incorretos (INVALID_CREDENTIALS).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Muitas tentativas (TOO_MANY_REQUESTS).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/logout:
    post:
      summary: Encerra a sessão atual.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '204': { description: Sessão encerrada e cookie removido. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/session:
    get:
      summary: Conta, vínculos e vínculo ativo (RN-ACE-16).
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Sessão válida.
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionView' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/session/link:
    put:
      summary: Escolhe o vínculo ativo da sessão (RN-ACE-03).
      description: Vínculo de outra conta, inativo ou inexistente responde 404 e nada muda.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SelectLinkRequest' } } }
      responses:
        '200':
          description: Vínculo ativo escolhido.
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionView' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/invitations/{code}:
    get:
      summary: Estado do convite para a tela de aceite. Rota pública.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Convite que pode ser aceito.
          content: { application/json: { schema: { $ref: '#/components/schemas/InviteInfo' } } }
        '410':
          description: INVITE_INVALID. Com o código certo, `fields` traz `reason` (USED, EXPIRED ou CANCELED); código desconhecido não traz motivo.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /auth/invitations/{code}/accept:
    post:
      summary: Aceita o convite e inicia a sessão (RN-ACE-07, RN-ACE-13). Rota pública.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AcceptInviteRequest' } } }
      responses:
        '200':
          description: Vínculo ativado e sessão iniciada.
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionView' } } }
        '400': { description: "Senha fraca ou conhecida demais (PASSWORD_WEAK, PASSWORD_LEAKED) ou dados inválidos.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: "Senha atual incorreta (INVALID_CREDENTIALS).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: "Convite inválido (INVITE_INVALID).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Muitas tentativas (TOO_MANY_REQUESTS).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/password-reset:
    post:
      summary: Pede o link de nova senha (RN-ACE-11, RN-ACE-14). Rota pública.
      description: Responde sempre a mesma mensagem, exista a conta ou não. Limite de 5 pedidos por e-mail e 20 por IP em 15 minutos.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } }
      responses:
        '200':
          description: Pedido recebido.
          content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { description: "Muitas tentativas por e-mail ou por IP (TOO_MANY_REQUESTS).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/password-reset/{code}:
    post:
      summary: Define a nova senha pelo link e inicia a sessão (RN-ACE-14). Rota pública.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetBody' } } }
      responses:
        '200':
          description: Senha trocada, outras sessões encerradas e sessão iniciada.
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionView' } } }
        '400': { description: "Senha fraca ou conhecida demais (PASSWORD_WEAK, PASSWORD_LEAKED) ou dados inválidos; o link não é consumido.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: "Link inválido, vencido ou já usado (RESET_LINK_INVALID).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/password:
    post:
      summary: Troca a senha de quem está logado (RN-ACE-20).
      description: Encerra as sessões da conta em outros aparelhos, mantém a atual e envia e-mail de aviso.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangePasswordRequest' } } }
      responses:
        '204': { description: Senha trocada. }
        '400': { description: "Senha atual incorreta, senha nova fraca ou conhecida demais, ou dados inválidos.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/login/two-factor:
    post:
      summary: Segundo passo do login com duas etapas (RN-ACE-17). Rota pública.
      description: |
        Recebe o bilhete do login e um código TOTP de 6 dígitos ou um código de reserva. O bilhete vale 5 minutos, é de uso único e
        morre depois de 5 erros. A resposta de erro é a mesma para código errado, usado ou vencido (INVALID_TWO_FACTOR_CODE).
        Os erros contam na trava de 15 minutos do e-mail e no limite por IP (TOO_MANY_REQUESTS, 429).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TwoFactorLoginRequest' } } }
      responses:
        '200':
          description: Sessão iniciada; cookie SESSION na resposta.
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionView' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: "Código inválido (INVALID_TWO_FACTOR_CODE) ou bilhete vencido, usado ou desconhecido (TWO_FACTOR_TICKET_INVALID).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Muitas tentativas (TOO_MANY_REQUESTS).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/two-factor/setup:
    post:
      summary: Começa a ligar as duas etapas (RN-ACE-17).
      description: Gera um segredo novo (substitui um pendente). Nada fica ativo até `POST /auth/two-factor/enable`. Com as duas etapas já ligadas responde 409.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200':
          description: Segredo em base32 e endereço `otpauth://` para o QR code; mostrados só agora.
          content: { application/json: { schema: { $ref: '#/components/schemas/TwoFactorSetup' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/two-factor/enable:
    post:
      summary: Liga as duas etapas com um código válido (RN-ACE-17, RN-ACE-18).
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TwoFactorCode' } } }
      responses:
        '200':
          description: Ligadas. Os 10 códigos de reserva aparecem só nesta resposta.
          content: { application/json: { schema: { $ref: '#/components/schemas/BackupCodes' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: "Código inválido (INVALID_TWO_FACTOR_CODE) ou sem sessão.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/two-factor:
    delete:
      summary: Desliga as duas etapas, com senha e código (RN-ACE-17).
      description: Quem é obrigado a tê-las (Coordenador) recebe 403 FORBIDDEN e nada muda. Apaga o segredo e os códigos de reserva.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordAndCode' } } }
      responses:
        '204': { description: Desligadas. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: "Senha ou código incorretos (INVALID_CREDENTIALS, INVALID_TWO_FACTOR_CODE) ou sem sessão.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: "Muitas tentativas (TOO_MANY_REQUESTS).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/two-factor/backup-codes:
    post:
      summary: Pede 10 códigos de reserva novos, com senha e código (RN-ACE-18).
      description: Os anteriores deixam de valer. Sem as duas etapas ligadas responde 409.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordAndCode' } } }
      responses:
        '200':
          description: Códigos novos, mostrados só nesta resposta.
          content: { application/json: { schema: { $ref: '#/components/schemas/BackupCodes' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: "Senha ou código incorretos (INVALID_CREDENTIALS, INVALID_TWO_FACTOR_CODE) ou sem sessão.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: "Muitas tentativas (TOO_MANY_REQUESTS).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/reauth:
    post:
      summary: Confirma uma ação crítica com a senha (e o código, se as duas etapas estão ligadas) (RN-ACE-21).
      description: |
        Devolve um token de uso único, válido por 5 minutos, preso à sessão e à ação. A rota crítica o recebe no cabeçalho `X-Reauth-Token`
        e o consome; sem token válido ela responde 403 REAUTH_REQUIRED. Senha ou código errados contam na trava de tentativas.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReauthRequest' } } }
      responses:
        '200':
          description: Confirmação aceita.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReauthToken' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: "Senha ou código incorretos (INVALID_CREDENTIALS, INVALID_TWO_FACTOR_CODE) ou sem sessão.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Muitas tentativas (TOO_MANY_REQUESTS).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/email-change:
    post:
      summary: Pede a troca do e-mail da conta (RN-ACE-15).
      description: |
        Exige a senha e, com as duas etapas ligadas, o código. Registra um pedido pendente (24 horas) e envia o link de confirmação ao
        endereço novo; o e-mail da conta não muda neste passo. Novo pedido cancela o pendente; no máximo 3 por hora por conta.
        Responde 202 também quando o endereço já é de outra conta (nada é enviado), para não revelar quem tem conta (RN-ACE-11).
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailChangeRequest' } } }
      responses:
        '202': { description: Pedido aceito. }
        '400': { description: "Endereço mal formado ou igual ao atual (VALIDATION_ERROR).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: "Senha ou código incorretos (INVALID_CREDENTIALS, INVALID_TWO_FACTOR_CODE) ou sem sessão.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Muitas tentativas ou mais de 3 pedidos na hora (TOO_MANY_REQUESTS).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/email-change/{code}/confirm:
    post:
      summary: Confirma a troca de e-mail com o link recebido (RN-ACE-15).
      description: |
        Só quem está logado na conta dona do pedido. Troca o e-mail, marca o pedido como usado e avisa o endereço antigo. Link vencido, usado,
        cancelado, de outra conta ou cujo endereço passou a ser de outra conta responde 410 EMAIL_CHANGE_INVALID e nada muda.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: E-mail trocado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { description: "Link inválido (EMAIL_CHANGE_INVALID).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/sessions:
    get:
      summary: Sessões ativas da própria conta (RF-ACE-04).
      description: Sem token, hash nem IP. `device` é um rótulo ("Chrome em Windows") e `city` vem vazia quando desconhecida.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Sessões vivas da conta, a mais recente primeiro.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AccountSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      summary: Encerra todas as outras sessões da conta e mantém a atual (RF-ACE-04).
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '204': { description: Encerradas. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/sessions/{id}:
    delete:
      summary: Encerra uma sessão da própria conta que não seja a atual (RF-ACE-04).
      description: Sessão de outra conta ou inexistente responde 404; a atual responde 409 SESSION_CURRENT (para ela existe `POST /auth/logout`).
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Encerrada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: "Sessão não encontrada (NOT_FOUND).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: "É a sessão em uso (SESSION_CURRENT).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /permissions:
    get:
      summary: Permissões efetivas do vínculo ativo, para montar o menu (RNF-05, D4 da #27).
      description: |
        Um nível por linha da tabela de permissões (`docs/especificacao/02-contas-e-acesso.md`). Aluno, Responsável e sessão sem
        vínculo ativo recebem tudo `NONE`. Para o Professor, a permissão "*" aparece ligada se estiver ligada em ao menos uma unidade;
        cada rota ainda confere a unidade no servidor. Só lê: não grava auditoria.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Níveis do vínculo ativo.
          content: { application/json: { schema: { $ref: '#/components/schemas/PermissionsView' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /organization:
    get:
      summary: Dados da organização do vínculo ativo (RF-ORG-01).
      description: |
        A organização é sempre a do vínculo ativo; nenhum identificador de organização é aceito. Coordenador e Administrador leem;
        Professor e portal recebem 403. Não traz credencial nem segredo de integração (RNF-08). `logoUrl` é uma URL temporária
        assinada (RN-ORG-03), nula quando não há logo.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Dados da organização.
          content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationView' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      summary: Altera nome, cor principal e titular (RF-ORG-01). Só o Coordenador.
      description: |
        Os três campos são enviados juntos; `color` e `holderDocument` vazios ou nulos voltam ao padrão. Cor reprovada no contraste AA
        (menos de 4,5:1 com texto branco), CPF/CNPJ inválido ou nome fora de 1 a 120 caracteres respondem 400 VALIDATION_ERROR com o campo
        apontado e nada é salvo. Grava `organization.update` na auditoria quando algum valor muda.
        Exige `If-Match` com o `version` lido (RNF-15): versão diferente da atual responde 409 `EDIT_CONFLICT` e nada é gravado; cabeçalho
        ausente ou não numérico responde 428 `PRECONDITION_REQUIRED`. A permissão é conferida antes da versão. A versão só sobe quando algum
        valor muda.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"?[0-9]+"?$' }, description: Versão lida em `version`. }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationUpdateRequest' } } }
      responses:
        '200':
          description: Dados salvos.
          content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationView' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/EditConflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /organization/logo:
    put:
      summary: Troca a logo (RF-ORG-01). Só o Coordenador.
      description: |
        Campo `file` com PNG, JPEG ou WebP, exatamente 512 x 512 px e até 5 MB; o tipo é conferido pelo conteúdo. Outro tipo, outro tamanho,
        arquivo corrompido ou grande demais respondem 400 VALIDATION_ERROR (campo `file`) e a logo anterior permanece. O arquivo antigo é apagado.
        Grava `organization.logo.update`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Logo trocada.
          content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationView' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
    delete:
      summary: Remove a logo (RF-ORG-01). Só o Coordenador. Idempotente.
      description: Sem logo, repete sem erro e sem auditoria. Com logo, apaga o arquivo e grava `organization.logo.remove`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200':
          description: Logo removida (`logoUrl` nula).
          content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationView' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /organization/coordination-transfer:
    post:
      summary: Transfere a coordenação a um Administrador ativo (RF-ORG-06). Só o Coordenador.
      description: |
        Exige `X-Reauth-Token` da ação `TRANSFER_COORDINATION` (uso único; sem token válido, 403 REAUTH_REQUIRED) e a confirmação digitada
        `TRANSFERIR` (sem diferenciar maiúsculas, sem espaços nas pontas). O novo Coordenador é indicado pelo e-mail e precisa ser Administrador
        ativo da mesma organização; qualquer outro e-mail responde 400 VALIDATION_ERROR no campo `email`, sem revelar contas de outras organizações.
        Na troca, o antigo vira Administrador de todas as unidades e o novo perde os vínculos de unidade (tudo ou nada); vale na hora, sem novo
        login. O novo Coordenador recebe e-mail de confirmação. Grava `organization.coordination_transferred`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: X-Reauth-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, confirmation]
              properties:
                email: { type: string }
                confirmation: { type: string, example: TRANSFERIR }
      responses:
        '204': { description: Coordenação transferida. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /units:
    get:
      summary: Lista as unidades da organização do vínculo ativo (RF-ORG-02). Só o Coordenador.
      description: |
        A organização é sempre a do vínculo ativo. Sem paginação (no máximo 10 unidades, RN-ORG-05). `administrators` traz só os
        Administradores com vínculo ativo na unidade. `activeStudents` conta alunos distintos com modalidade ativa na unidade (RN-ORG-11).
        Administrador, Professor e portal recebem 403.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Unidades da organização, em ordem de nome.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UnitSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Cria uma unidade na organização do vínculo ativo (RF-ORG-03). Só o Coordenador.
      description: |
        Só `name` é obrigatório (até 120 caracteres). `postalCode` (8 dígitos, com ou sem hífen), `phone` e `whatsapp` (DDD + número),
        `email`, `address` e `city` são opcionais e validados quando enviados. `latitude` e `longitude` (faixas -90..90 e -180..180)
        vêm juntas; sem elas e com CEP, a porta de localização as obtém; sem resultado a unidade nasce sem coordenadas (RN-ORG-14).
        O nome curto é gerado do nome e o inicial entra no histórico (RN-ORG-15). A unidade nasce com as configurações padrão.
        No limite de 10 unidades responde 409 `UNIT_LIMIT_REACHED` e nada é criado (RN-ORG-05).
        `administrator` (nome e e-mail, juntos) convida um Administrador vinculado só à nova unidade, depois de criada; se o convite
        falhar, a unidade permanece e `invite` volta `FAILED`. Grava `unit.create` na auditoria, sem o e-mail do convidado.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NewUnit' } } }
      responses:
        '201':
          description: Unidade criada.
          content: { application/json: { schema: { $ref: '#/components/schemas/NewUnitResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /units/mine:
    get:
      summary: Unidades que o vínculo pode configurar (RF-ORG-04). Coordenador e Administrador.
      description: |
        Unidades da organização do vínculo ativo sobre as quais há permissão de configuração (linha `UNIT_SETTINGS`):
        todas para o Coordenador, só as suas para o Administrador. Professor e portal recebem 403.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Unidades, em ordem de nome.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UnitChoice' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /units/reachable:
    get:
      summary: Unidades ao alcance do vínculo, para o seletor da barra superior (RF-ORG-05). Coordenador, Administrador e Professor.
      description: |
        Unidades ativas da organização do vínculo ativo: todas para o Coordenador (com `allUnits` verdadeiro, que habilita
        "Todas as unidades" só para consulta); só as do vínculo para Administrador e Professor (`allUnits` falso). Em ordem de nome.
        Somente leitura, sem auditoria. `organizationId` na consulta é ignorado. Portal recebe 403.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: As unidades ao alcance.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReachableUnits' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /units/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Dados e configurações de uma unidade (RF-ORG-04). Coordenador e Administrador da unidade.
      description: |
        Professor, portal e Administrador de outra unidade recebem 403. Unidade de outra organização ou inexistente responde 404.
        `settings.paymentAccount` mostra só a situação da conexão; a referência da conta nunca é devolvida.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: A unidade e suas configurações.
          content: { application/json: { schema: { $ref: '#/components/schemas/UnitDetail' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Substitui os dados e as configurações da unidade (RF-ORG-04). Coordenador e Administrador da unidade.
      description: |
        Substituição completa: campo opcional omitido apaga o valor (a tela sempre envia tudo). `organizationId`, `shortName` e
        `paymentAccount` enviados são ignorados. `name` obrigatório (até 120). `cnpj` com dígito verificador, guardado só com dígitos.
        `latitude` e `longitude` vêm juntas; com CEP novo e sem coordenadas a porta de localização as obtém (RN-ORG-14).
        `dueDays`: de 1 a 28, sem repetição, ao menos um (guardados em ordem crescente). Taxa de matrícula desligada grava 0.
        Taxas por meio: centavos de 0 a 100000. `pixKey`: CPF, CNPJ, e-mail, telefone (+55) ou UUID; em branco apaga.
        `reminderDays`: de -30 a 60, sem repetição, até 8, podendo ficar vazio. Grava `unit.update` na auditoria com antes e depois
        dos campos mudados (chave Pix e CNPJ só como alterados, sem o valor); chamada sem mudança não grava.
        Exige `If-Match` com o `version` lido (RNF-15): versão diferente da atual responde 409 `EDIT_CONFLICT` e nada é gravado; cabeçalho
        ausente ou não numérico responde 428 `PRECONDITION_REQUIRED`. A permissão é conferida antes da versão. A versão só sobe quando algum
        valor muda.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"?[0-9]+"?$' }, description: Versão lida em `version`. }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnitUpdate' } } }
      responses:
        '200':
          description: A unidade com os novos valores.
          content: { application/json: { schema: { $ref: '#/components/schemas/UnitDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/EditConflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /units/{id}/short-name:
    patch:
      summary: Ajusta o nome curto da unidade, uma única vez (RN-ORG-15). Só o Coordenador.
      description: |
        Formato `a-z0-9` e hífen (sem hífen nas pontas), de 1 a 60 caracteres; fora dele responde 400 VALIDATION_ERROR (campo `shortName`).
        Nome em uso por outra unidade, nome antigo de qualquer unidade (reservado para sempre) ou unidade já ajustada respondem 409.
        Unidade de outra organização responde 404, igual a id inexistente. O nome antigo passa a redirecionar para o novo.
        Grava `unit.short_name.update` na auditoria, com antes e depois.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnitShortNameRequest' } } }
      responses:
        '200':
          description: Nome curto ajustado (`shortNameAdjusted` verdadeiro).
          content: { application/json: { schema: { $ref: '#/components/schemas/UnitSummary' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /units/{id}/deactivation-check:
    get:
      summary: O que impede desativar a unidade (RF-ORG-07). Só o Coordenador.
      description: |
        `canDeactivate` é verdadeiro só sem alunos com modalidade ativa, sem turmas ativas e havendo outra unidade ativa
        (`lastActiveUnit` falso). `activeStudents` (alunos distintos com modalidade ativa na unidade) e `activeClasses` vêm do banco.
        Unidade de outra organização ou inexistente responde 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Situação da unidade para a desativação.
          content: { application/json: { schema: { $ref: '#/components/schemas/UnitDeactivationCheck' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /units/{id}/deactivation:
    post:
      summary: Desativa a unidade (RF-ORG-07, RN-ORG-11). Só o Coordenador.
      description: |
        Exige `X-Reauth-Token` da ação `DEACTIVATE_UNIT` (uso único; sem token válido, 403 REAUTH_REQUIRED) e a confirmação digitada igual ao
        nome da unidade (sem diferenciar maiúsculas, sem espaços nas pontas; senão 400 VALIDATION_ERROR no campo `confirmation`).
        Com aluno de modalidade ativa, turma ativa ou sendo a única unidade ativa, responde 409 `UNIT_HAS_BLOCKERS` e `fields` traz
        `activeStudents`, `activeClasses` e `lastActiveUnit` (valores em texto); nada muda e o token não é gasto.
        Unidade já desativada responde 409 `CONFLICT`; de outra organização ou inexistente, 404. Nada é apagado: a unidade segue em
        `GET /units` com `active = false` e sai de `GET /units/reachable`. Grava `unit.deactivated` na auditoria, com antes e depois.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Reauth-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: { type: string, description: 'Nome da unidade.' }
      responses:
        '204': { description: Unidade desativada. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /units/{unitId}/modalities:
    parameters:
      - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Modalidades ativas da organização com a marcação da unidade (RF-MOD-03, RN-MOD-02). Coordenador e Administrador da unidade.
      description: |
        Devolve só as modalidades ativas da organização, em ordem de nome, com `offered` (a unidade oferece) e `canManage`. A marcação
        feita antes de a organização desativar a modalidade fica guardada, não aparece e volta se ela for reativada. Professor, portal e
        Administrador de outra unidade recebem 403. Unidade de outra organização ou inexistente responde 404.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: As modalidades da unidade.
          content: { application/json: { schema: { $ref: '#/components/schemas/UnitModalities' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /units/{unitId}/modalities/{modalityId}:
    put:
      summary: Marca ou desmarca a modalidade na unidade (RF-MOD-03, RN-MOD-02, RN-MOD-03). Coordenador e Administrador da unidade.
      description: |
        Só modalidade ativa na organização pode ser marcada; inativa ou fora do catálogo responde 404. Repetir o valor responde 200 sem
        nova auditoria. Sem `If-Match`: cada marcação é independente e idempotente. Grava `unit.modality.offered` ou
        `unit.modality.withdrawn` na auditoria. Corpo sem `offered`, 400. Unidade de outra organização ou inexistente, 404; Professor,
        portal e Administrador de outra unidade, 403. Desmarcar com turma ativa dessa modalidade na unidade responde 409
        `UNIT_MODALITY_IN_USE`, `fields` traz um item `class` por turma que impede (o nome em `message`), em ordem de nome, e nada muda.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: modalityId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offered]
              properties:
                offered: { type: boolean }
      responses:
        '200':
          description: A modalidade com a nova marcação.
          content: { application/json: { schema: { $ref: '#/components/schemas/UnitModality' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /modalities:
    get:
      summary: Catálogo de modalidades com a situação na organização do vínculo ativo (RF-MOD-01, RN-MOD-01).
      description: |
        Devolve as 14 modalidades iniciais (iguais para todas as organizações) em ordem de nome, com `active` da organização e
        `canManage` (verdadeiro só para o Coordenador). Coordenador e Administrador leem; Professor e portal recebem 403.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Catálogo com a situação da organização.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Modality' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /modalities/{id}/activation:
    put:
      summary: Ativa ou desativa a modalidade para a organização (RN-MOD-02, RN-MOD-06). Só o Coordenador.
      description: |
        Repetir o mesmo valor responde 200 sem nova auditoria. Desativar com turma ativa ou aluno com a modalidade ativa responde
        409 `MODALITY_IN_USE` e `fields` traz `activeClasses` e `activeStudents` (valores em texto); nada muda. Grava
        `modality.activated` ou `modality.deactivated` na auditoria. Id fora do catálogo responde 404; corpo sem `active`, 400.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200':
          description: A modalidade com a nova situação.
          content: { application/json: { schema: { $ref: '#/components/schemas/Modality' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /modalities/{id}/graduation:
    get:
      summary: Sistema de graduação da organização para uma modalidade ativa (RF-MOD-02, RN-GRA-01). Coordenador e Administrador.
      description: |
        Devolve `enabled`, `requireOriginProof`, `canManage` (verdadeiro só para o Coordenador) e os níveis na ordem. Id fora do catálogo
        responde 404; modalidade que a organização não tem ativa, 409 `MODALITY_NOT_ACTIVE`. Professor e portal recebem 403.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Sistema de graduação da organização.
          content: { application/json: { schema: { $ref: '#/components/schemas/Graduation' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      summary: Grava o sistema de graduação inteiro (RF-MOD-02, RN-GRA-01). Só o Coordenador.
      description: |
        Grava de uma vez `enabled`, `requireOriginProof` e a lista completa de níveis na ordem enviada: nível com `id` é atualizado, sem
        `id` é criado e o que ficou de fora é removido; tudo ou nada. Nome de 1 a 40 caracteres e único na modalidade (sem diferenciar
        maiúsculas nem acentos), cores `#RRGGBB`, grau de 0 a 10, idades de 0 a 120 com mínima menor ou igual à máxima, até 30 níveis; ligar
        exige ao menos um nível. Erro de campo responde 400 com o campo (ex.: `levels[2].name`); `id` de nível que não é desta modalidade
        e organização, 400. Modalidade fora do catálogo, 404; não ativa na organização, 409 `MODALITY_NOT_ACTIVE`. Grava
        `modality.graduation_updated` na auditoria; repetir a mesma gravação responde 200 sem nova auditoria.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GraduationUpdate' } } }
      responses:
        '200':
          description: O sistema de graduação gravado.
          content: { application/json: { schema: { $ref: '#/components/schemas/Graduation' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /modalities/requests:
    get:
      summary: Pedidos de modalidade nova da organização (RN-MOD-04). Coordenador e Administrador.
      description: Do pedido mais novo para o mais antigo. Professor e portal recebem 403.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Pedidos da organização.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ModalityRequest' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Pede à plataforma uma modalidade que não está no catálogo (RN-MOD-04). Só o Coordenador.
      description: |
        `name` de 2 a 60 caracteres e `note` opcional até 300 (senão 400 no campo). Nome já pedido pela organização e ainda aberto
        (sem diferenciar maiúsculas) responde 409 `REQUEST_ALREADY_OPEN`; nome que já existe no catálogo (sem diferenciar acento
        nem maiúsculas), 409 `ALREADY_IN_CATALOG`. Grava `modality.requested` na auditoria.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 60 }
                note: { type: string, nullable: true, maxLength: 300 }
      responses:
        '201':
          description: Pedido gravado com situação OPEN.
          content: { application/json: { schema: { $ref: '#/components/schemas/ModalityRequest' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /age-ranges:
    get:
      summary: Faixas etárias da organização do vínculo ativo (RF-MOD-04, RN-MOD-07). Coordenador e Administrador.
      description: |
        Ordenadas por idade mínima e depois por nome. `maxAge` nulo significa sem limite ("18 anos ou mais"); `canManage` é verdadeiro só
        para o Coordenador. Professor e portal recebem 403. Toda organização nasce com Infantil 4–12, Juvenil 13–17 e Adulto 18+.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Faixas etárias da organização.
          content: { application/json: { schema: { $ref: '#/components/schemas/AgeRangeList' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Cria uma faixa etária (RN-ORG-17). Só o Coordenador.
      description: |
        `name` de 2 a 40 caracteres, `minAge` de 0 a 120 e `maxAge` opcional da mínima a 120 (senão 400 no campo). O nome é único na
        organização sem diferenciar acento nem maiúsculas (409 `AGE_RANGE_NAME_TAKEN`); faixas podem se sobrepor em idade. Grava
        `age_range.created` na auditoria.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgeRangeBody' } } }
      responses:
        '201':
          description: Faixa criada.
          content: { application/json: { schema: { $ref: '#/components/schemas/AgeRange' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /age-ranges/{id}:
    put:
      summary: Renomeia e muda as idades de uma faixa etária (RN-ORG-17). Só o Coordenador.
      description: |
        Mesmas validações da criação; reenviar os mesmos valores responde 200 sem nova auditoria; nome de outra faixa, 409
        `AGE_RANGE_NAME_TAKEN`. Sem `If-Match`: vale a última gravação. Faixa de outra organização ou inexistente, 404. Grava
        `age_range.updated` na auditoria.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgeRangeBody' } } }
      responses:
        '200':
          description: A faixa com os novos valores.
          content: { application/json: { schema: { $ref: '#/components/schemas/AgeRange' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Apaga uma faixa etária (RN-ORG-17). Só o Coordenador.
      description: Faixa de outra organização, inexistente ou já apagada, 404. Grava `age_range.deleted` na auditoria.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Faixa apagada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agenda:
    get:
      summary: Aulas do período e dias sem aula de uma unidade (RF-AGE-01). Coordenador, Administrador e Professor.
      description: |
        `from` e `to` (`yyyy-MM-dd`, `to` >= `from`, no máximo 31 dias) são obrigatórios. Ordenada por data e início. O Coordenador vê todas as
        unidades; o Administrador, as dele (`unitId` fora do alcance ou desconhecido: 404); sem `unitId`, a primeira unidade do alcance por nome.
        O Professor só vê aulas das turmas dele (titular ou auxiliar) ou em que é o professor da aula. Aluno e Responsável recebem 403.
        `teacherId` filtra o professor da aula e `modalityId` a modalidade; combinam (E); id de outra organização devolve lista vazia.
        A situação é calculada na leitura pelo relógio no fuso da unidade (início inclusive, término exclusive); `CANCELLED` vale sobre qualquer
        horário e traz `cancelReason`. `canEdit` e `canCancel` são dicas (RN-AGE-08): quem grava confere de novo. Sem lista de espera nem presença.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: teacherId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: modalityId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Agenda do período.
          content: { application/json: { schema: { $ref: '#/components/schemas/Agenda' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agenda/lessons:
    post:
      summary: Cria aula avulsa, sem turma (RF-AGE-04). Coordenador, Administrador e Professor com `AGENDA_EDIT`.
      description: |
        A aula avulsa não tem turma (`class` nulo) e traz `title`; `visibilityClassId` (turma ativa da mesma unidade) diz que turma a vê no portal,
        ausente = todas as turmas da unidade (RN-AGE-12). `title` de 1 a 80 caracteres; `endsAt` depois de `startsAt`; início não fica no passado no
        fuso da unidade (400 com o campo). A modalidade é ativa e oferecida pela unidade e o professor é ativo e ensina a modalidade (RN-PRO-06), de
        qualquer unidade (422 em `modalityId` ou `teacherId`); turma de visibilidade desativada ou de outra unidade: 422 em `visibilityClassId`;
        `substitute` é sempre falso. O Professor só cria aula em que ele é o professor (outro: 403) e só em unidade do alcance dele. Sem `AGENDA_EDIT`,
        Aluno e Responsável: 403; unidade, turma de visibilidade de outra organização ou unidade fora do alcance do Administrador: 404. Grava
        `lesson.created`, na mesma transação. A aula avulsa abre no painel, edita (só `THIS`) e cancela como as demais.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LessonCreateInput' } } }
      responses:
        '201':
          description: Painel da aula criada.
          content: { application/json: { schema: { $ref: '#/components/schemas/LessonDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'Regra de negócio recusa o pedido (UNPROCESSABLE); `fields` traz o campo. Nada é gravado.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /agenda/lessons/{id}:
    get:
      summary: Painel da aula (RF-AGE-02). Coordenador, Administrador e Professor.
      description: |
        Só leitura, sem auditoria. O Coordenador abre qualquer aula da organização; o Administrador, as de unidade dele (outra: 404). O Professor
        abre as aulas das turmas dele (titular ou auxiliar) e, como substituto de outra turma (RN-PRO-06), só do início ao fim do dia da aula no fuso
        da unidade; fora disso, 404. Aluno e Responsável recebem 403; aula inexistente ou de outra organização, 404. `head` (titular) só vem na
        substituição. `activeStudents` conta os alunos ativos da turma da aula (principal ou outro horário); `trialClasses` vale 0 até a Sprint 18. `canEdit`, `canCancel` e `canViewClass` são dicas.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Painel da aula.
          content: { application/json: { schema: { $ref: '#/components/schemas/LessonDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Edita a aula (RF-AGE-03). Coordenador, Administrador e Professor com `AGENDA_EDIT`.
      description: |
        `scope` `THIS` muda só a aula; `FOLLOWING` aplica horário e professor a ela e às seguintes (as seguintes que já têm substituto gravado mantêm o professor e o `substitute`; só data e horário mudam) da turma ainda não iniciadas (nem canceladas
        nem concluídas) e desloca a data de cada uma pelo mesmo número de dias da mudança desta; tudo ou nada. O professor é ativo, da organização
        e ensina a modalidade da turma, o titular inclusive (outro: 422 em `teacherId`); se não for o titular, `substitute` fica verdadeiro, e o titular da turma não muda.
        A aula editada fica com `manually_edited`. Início no passado ou `endsAt` antes de `startsAt`: 400; mesmo dia e início de outra aula da turma:
        409. Cancelada: 409. Concluída: só Coordenador e Administrador, em até 30 dias do término, só o professor (data e horário iguais), com
        `reason` obrigatório; fora disso 409. Grava `lesson.updated`. Sem `AGENDA_EDIT`, 403; fora do alcance ou da visibilidade, 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LessonEditInput' } } }
      responses:
        '200':
          description: Painel da aula atualizado.
          content: { application/json: { schema: { $ref: '#/components/schemas/LessonDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: 'Regra de negócio recusa o pedido (UNPROCESSABLE); `fields` traz o campo. Nada é gravado.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /agenda/lessons/{id}/cancel:
    post:
      summary: Cancela a aula (RF-AGE-03). Coordenador, Administrador e Professor com `AGENDA_EDIT`.
      description: |
        Só aula agendada ou em andamento (concluída ou já cancelada: 409). `reason` é um dos quatro códigos; `reasonText` (até 200) é obrigatório
        só em `OTHER` e ignorado nos demais. `channels` escolhe os canais do comunicado (o portal é sempre incluído); o envio é da Sprint 09, aqui
        só vão para a auditoria. Com aula experimental marcada e sem `trialDecision`, 422 em `trialDecision`. Grava `lesson.cancelled`.
        Cancela só a aula do id.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LessonCancelInput' } } }
      responses:
        '200':
          description: Painel da aula cancelada.
          content: { application/json: { schema: { $ref: '#/components/schemas/LessonDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: 'Regra de negócio recusa o pedido (UNPROCESSABLE); `fields` traz o campo. Nada é gravado.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /no-class-days:
    get:
      summary: Dias sem aula da unidade e feriados sugeridos (RF-AGE-05). Coordenador e Administrador (`NO_CLASS_DAYS`).
      description: |
        Traz os dias da unidade cujo fim é hoje ou depois (fuso da unidade), por início, e `suggestions`: feriados nacionais dos próximos 12
        meses (calculados no servidor) que ainda não viraram dia sem aula na unidade. Nada é gravado até a unidade confirmar. `unitId` ausente
        escolhe a primeira unidade do alcance. `notice.status` é `NOT_NOTIFIED`, `SCHEDULED` ou `SENT` (o envio é da Sprint 09). Professor, Aluno e
        Responsável: 403; unidade fora do alcance do Administrador ou de outra organização: 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Dias sem aula da unidade.
          content: { application/json: { schema: { $ref: '#/components/schemas/NoClassDayList' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Lança dia ou período sem aula, um por unidade (RF-AGE-05). Coordenador (várias unidades) e Administrador (uma).
      description: |
        Tudo ou nada. `reason` de 1 a 120 caracteres; `startsOn` hoje ou depois no fuso de cada unidade; `endsOn` não antes de `startsOn`; período de
        até 90 dias; `holiday` verdadeiro dá origem `HOLIDAY`, senão `COORDINATOR` ou `UNIT`. `classIds` vazio vale para todas as turmas; com
        turmas, só uma unidade e turmas ativas dela (422 em `classIds`; turma de outra organização: 404). `notice.mode` `SCHEDULED` exige `sendAt`
        futuro e antes do início do dia (400 em `notice`); nada é enviado nesta entrega. Cancela as aulas da unidade no período que ainda não
        terminaram e não estão canceladas (`HOLIDAY` para feriado, senão `OTHER`, com o motivo como texto). Período sobreposto a outro dia da unidade:
        409. Administrador com várias unidades: 400. Grava `no_class_day.created`. A mensalidade não muda (RN-AGE-11).
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NoClassDayInput' } } }
      responses:
        '201':
          description: Os dias criados, um por unidade.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NoClassDayItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: 'Regra de negócio recusa o pedido (UNPROCESSABLE); `fields` traz o campo. Nada é gravado.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /no-class-days/preview:
    get:
      summary: Prévia das aulas que o dia sem aula cancelaria (RF-AGE-05). Coordenador e Administrador.
      description: |
        Mesmas validações do lançamento, menos o conflito de período; `unitIds` e `classIds` se repetem na consulta. Devolve, por unidade, as aulas
        não terminadas e não canceladas do período. Não grava nada.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: unitIds, in: query, required: true, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: startsOn, in: query, required: true, schema: { type: string, format: date } }
        - { name: endsOn, in: query, required: true, schema: { type: string, format: date } }
        - { name: classIds, in: query, required: false, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
      responses:
        '200':
          description: Aulas afetadas por unidade.
          content: { application/json: { schema: { $ref: '#/components/schemas/NoClassDayPreview' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'Regra de negócio recusa o pedido (UNPROCESSABLE); `fields` traz o campo.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /no-class-days/{id}:
    put:
      summary: Edita um dia sem aula futuro (RF-AGE-05). Coordenador e Administrador.
      description: |
        Só dia cujo início é depois de hoje (senão 409). Altera período, motivo, turmas e aviso (a unidade e a origem não mudam; `unitIds` e
        `holiday` são ignorados). As aulas que deixaram de ser afetadas voltam para Agendada e as recém afetadas são canceladas. Dia com aviso `SENT`
        não muda o aviso (400 em `notice`). Mesmas validações do lançamento; 409 também para sobreposição. Grava `no_class_day.updated`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NoClassDayInput' } } }
      responses:
        '200':
          description: O dia atualizado.
          content: { application/json: { schema: { $ref: '#/components/schemas/NoClassDayItem' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: 'Regra de negócio recusa o pedido (UNPROCESSABLE); `fields` traz o campo. Nada é gravado.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Desfaz um dia sem aula futuro (RF-AGE-05). Coordenador e Administrador.
      description: |
        Só dia cujo início é depois de hoje (senão 409). Apaga o dia e devolve para Agendada só as aulas que ele cancelou; cancelamento manual segue.
        Cada unidade desfaz o seu. `notify` (padrão falso) só fica na auditoria até a Sprint 09. Grava `no_class_day.deleted`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: notify, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '204': { description: Dia desfeito. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /classes:
    get:
      summary: Lista paginada de turmas da organização do vínculo ativo (RF-TUR-01). Coordenador e Administrador.
      description: |
        Ordenada por nome e depois id (`sort=name`). O Coordenador vê todas as unidades; o Administrador, as dele (`unitId` fora do alcance
        devolve lista vazia). Professor, Aluno e Responsável recebem 403. Sem `status` traz `ACTIVE` e `INACTIVE`. `q` ignora acento e
        maiúsculas; `teacherId` casa titular e auxiliar; `weekday` vai de 1 (segunda) a 7 (domingo); os filtros combinam (E).
        `activeStudents` conta alunos distintos com modalidade ativa na turma, principal ou outro horário; `overCapacity` só avisa (RN-TUR-02). A resposta não traz link do grupo nem contato.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: modalityId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: teacherId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: ageRangeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: weekday, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 7 } }
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACTIVE, INACTIVE] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { name: sort, in: query, required: false, description: Só `name`., schema: { type: string, enum: [name] } }
      responses:
        '200':
          description: Página de turmas.
          content: { application/json: { schema: { $ref: '#/components/schemas/ClassList' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Cria uma turma (RF-TUR-03). Coordenador e Administrador.
      description: |
        Nasce `ACTIVE` na `unitId` informada. `name` de 2 a 80 (único entre turmas ativas da unidade, sem caixa nem acento; repetido dá 409 com
        o campo `name`); `modalityId` ativa e oferecida pela unidade; `schedule` com ao menos um horário (um por dia de 1 a 7, `HH:mm`,
        término depois do início); `capacity` opcional de 1 a 200 e nunca bloqueia; `headTeacherId` obrigatório; titular e auxiliares são
        professores ativos da unidade que ensinam a modalidade da turma (RN-TUR-05; outro: 400 em `headTeacherId` ou `assistantIds`); `groupLink` opcional, `http` ou `https`, até 300. O Administrador só cria em unidade dele (outra: 403).
        Grava `class.created`, sem o link do grupo. Sem presença nem frequência (RN-TUR-06).
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClassInput' } } }
      responses:
        '201':
          description: Turma criada.
          content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Já existe turma ativa com este nome na unidade (`fields[0]` = `name`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /classes/options:
    get:
      summary: Opções do formulário de turma (RF-TUR-03). Coordenador e Administrador.
      description: |
        Unidades ativas do alcance do usuário (todas para o Coordenador; as dele para o Administrador), cada uma com as modalidades ativas
        que oferece e os professores ativos dela (só id e nome), e as faixas etárias da organização. Professor, Aluno e Responsável recebem 403.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Opções.
          content: { application/json: { schema: { $ref: '#/components/schemas/ClassOptions' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /classes/{id}:
    put:
      summary: Edita a turma (RF-TUR-03). Coordenador e Administrador.
      description: |
        Substitui os campos de `ClassInput`, menos `unitId` (ignorado: a unidade não muda); horários e auxiliares são o conjunto completo.
        Turma desativada dá 409; fora do alcance do Administrador ou de outra organização, 404. Capacidade abaixo dos alunos ativos salva
        (só avisa). Quando o conjunto de horários muda, `scheduleChanged` é verdadeiro e `notifyClass` (padrão verdadeiro) vai para a
        auditoria; as aulas futuras e o comunicado são de outros itens. Grava `class.updated`, sem o link do grupo.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClassInput' } } }
      responses:
        '200':
          description: Painel da turma com `scheduleChanged`.
          content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Turma desativada, ou nome já usado por turma ativa da unidade (`fields[0]` = `name`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    get:
      summary: Painel da turma (RF-TUR-02). Coordenador e Administrador.
      description: |
        Mesma regra de alcance da lista: o Administrador só abre turma de unidade dele; fora dele, ou de outra organização, 404. Professor,
        Aluno e Responsável recebem 403. `groupLink` só vem aqui (nunca na lista). `nextClass` é nulo até existirem aulas e `students` vem
        vazia até existir matrícula; `primary` é falso no aluno que tem a turma como outro horário (RN-TUR-04). `deactivation.allowed` é
        falso quando a turma já está desativada ou há alunos com ela como turma principal (RN-TUR-03). Sem presença nem frequência (RN-TUR-06).
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Painel da turma.
          content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /classes/{id}/deactivate:
    post:
      summary: Desativa a turma (RN-TUR-03). Coordenador e Administrador.
      description: |
        Só muda `status` para `INACTIVE`; nada é apagado e a turma continua na lista e no painel. Com aluno que a tem como turma principal,
        409 `HAS_PRIMARY_STUDENTS` com `primaryStudents` em `fields`; turma já desativada, 409. Sem corpo. Mesmo alcance do painel.
        Grava `class.deactivated`, sem dado pessoal.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Painel com `status` igual a `INACTIVE`.
          content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Turma já desativada, ou `HAS_PRIMARY_STUDENTS` (`fields[0]` = `primaryStudents`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /teachers:
    get:
      summary: Lista paginada de professores da organização do vínculo ativo (RF-PRO-01). Coordenador e Administrador.
      description: |
        Ordenada por nome e depois id (`sort=name`). O Coordenador vê todos; o Administrador vê os professores com ao menos uma das suas
        unidades (e todas as unidades deles); `unitId` fora do alcance dele devolve lista vazia. Professor, Aluno e Responsável recebem 403.
        Sem `status` traz `ACTIVE` e `INACTIVE`. `q` ignora acento e maiúsculas; os filtros combinam (E). `classCount` conta as turmas ativas em que é titular ou auxiliar.
        `photoUrl` é uma URL temporária assinada. A resposta nunca traz telefone nem e-mail (RN-PRO-04).
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: modalityId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACTIVE, INACTIVE] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { name: sort, in: query, required: false, description: Só `name`., schema: { type: string, enum: [name] } }
      responses:
        '200':
          description: Página de professores.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeacherList' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Cadastra um professor (RF-PRO-03). Coordenador e Administrador.
      description: |
        Nasce `ACTIVE`, sem conta. `name` de 2 a 80, `phone` brasileiro (guardado só com dígitos), `bio` até 300, ao menos uma unidade ativa da
        organização. O Administrador só escolhe unidades dele (outra: 403). `directoryConsent` exige `consentDeclaredByManagement` (RN-PRO-04).
        Modalidade ativa na organização, uma entrada por modalidade; com graduação ligada, `levelId` e `degree` (0 ao máximo do nível) são
        obrigatórios, sem graduação ficam nulos (RN-PRO-03). Grava `teacher.created`, sem e-mail nem telefone. Foto pela rota própria.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TeacherInput' } } }
      responses:
        '201':
          description: Professor criado.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeacherDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /teachers/options:
    get:
      summary: Opções do formulário de professor (RF-PRO-03). Coordenador e Administrador.
      description: Modalidades ativas da organização com `graduationEnabled` e, se ligada, os níveis. Professor, Aluno e Responsável recebem 403.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Opções.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeacherOptions' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /teachers/{id}:
    put:
      summary: Edita o professor (RF-PRO-03). Coordenador e Administrador.
      description: |
        Substitui os campos do cadastro (unidades e modalidades como conjunto completo); não altera situação nem conta e vale também para
        professor inativo. O Administrador troca só as unidades dele e as de fora do alcance dele permanecem; sem alcance sobre o professor,
        404. Mesmas validações de `POST /teachers`. Grava `teacher.updated`, sem e-mail nem telefone. Tirar uma modalidade em que o
        professor é titular ou auxiliar de turma ativa responde 409 `TEACHER_MODALITY_IN_USE` (RN-PRO-09), `fields` com um item `class`
        por turma que impede (o nome em `message`), e nada muda; turma desativada não impede.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TeacherInput' } } }
      responses:
        '200':
          description: Professor atualizado.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeacherDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      summary: Painel do professor (RF-PRO-02). Coordenador e Administrador.
      description: |
        Traz foto, apresentação, contato (e-mail e telefone, só nesta rota autenticada; RN-PRO-04), graduação por modalidade, unidades,
        `classes` e `upcomingClasses` (vazias até a Sprint 05) e a situação do acesso. O Administrador só abre professor com ao menos uma
        unidade dele (e vê todas as unidades); fora disso, ou de outra organização, 404. Professor, Aluno e Responsável recebem 403.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Painel do professor.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeacherDetail' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teachers/{id}/photo:
    put:
      summary: Troca a foto do professor (RF-PRO-03). Coordenador e Administrador.
      description: |
        Campo `file` com PNG, JPEG ou WebP, exatamente 512 x 512 px e até 5 MB, conferido pelo conteúdo. Erro: 400 (campo `file`) e a foto
        anterior permanece. O arquivo antigo é apagado. Sem alcance sobre o professor, 404. Grava `teacher.photo_updated`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Foto trocada.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeacherDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
    delete:
      summary: Remove a foto do professor (RF-PRO-03). Coordenador e Administrador.
      description: Apaga o arquivo e grava `teacher.photo_removed`; sem foto, repete sem erro e sem auditoria.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Foto removida.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeacherDetail' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teachers/{id}/access:
    post:
      summary: Dá acesso ao sistema ao professor (RN-PRO-02). Coordenador e Administrador.
      description: |
        Envia o convite ao e-mail do cadastro, cria o vínculo `TEACHER` pendente nas unidades escolhidas e liga o cadastro à conta. Sem
        `unitIds`, usa as unidades ativas do professor que quem chama alcança. Administrador com unidade fora do alcance: 403; unidade fora
        das unidades do professor ou inativa: 400; sem e-mail: 400. Professor inativo, acesso já pendente ou ativo, conta já ligada a outro
        cadastro (`ALREADY_LINKED`) e limite de usuários de gestão (`STAFF_LIMIT_REACHED`): 409. Grava `teacher.access_granted`, sem código.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                unitIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Painel com `access` igual a `PENDING`.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeacherDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Recusa (inativo, acesso já existente, conta ligada, limite).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /teachers/{id}/access/resend:
    post:
      summary: Reenvia o convite pendente do professor (RN-PRO-02). Coordenador e Administrador.
      description: |
        Só com `access` igual a `PENDING`; nos demais casos 409. Invalida o convite anterior (mesmo limite de 3 reenvios por dia de
        RN-ACE-13). Grava `teacher.invite_resent`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Convite reenviado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Acesso que não está pendente.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: Limite de reenvios do dia (TOO_MANY_REQUESTS).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /teachers/{id}/deactivation:
    get:
      summary: Pré-visualiza a inativação do professor (RF-PRO-04). Coordenador e Administrador.
      description: |
        Não altera nada. `headClasses` lista as turmas em que o professor é titular e que ficarão sem titular (turmas ativas).
        `canDeactivate` é falso se o professor já está inativo ou, para o Administrador, se alguma unidade do professor (ativa ou não)
        está fora do alcance dele. Administrador sem alcance sobre o professor: 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pré-visualização.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeacherDeactivationPreview' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teachers/{id}/deactivate:
    post:
      summary: Inativa o professor (RF-PRO-04, RN-PRO-05). Coordenador e Administrador.
      description: |
        Muda a situação para `INACTIVE`, encerra o vínculo de Professor na organização (convite pendente é cancelado) e as sessões que
        dependiam dele; a conta e o cadastro continuam. Sem corpo. O Coordenador inativa qualquer professor; o Administrador só quem tem
        todas as unidades entre as dele (senão 403). Professor já inativo: 409. Grava `teacher.deactivated`, sem e-mail nem telefone.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Painel com `status` igual a `INACTIVE`.
          content: { application/json: { schema: { $ref: '#/components/schemas/TeacherDetail' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Professor já inativo.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /users:
    get:
      summary: Lista a equipe da gestão que o vínculo ativo gere (RF-ACE-06). Coordenador e Administrador.
      description: |
        O Coordenador vê os Administradores da organização; o Administrador vê os Professores com ao menos uma das suas unidades.
        Professor, Aluno e Responsável recebem 403. Sem `status` devolve `PENDING` e `ACTIVE`; `ENDED` só quando pedido.
        `canManage` é falso quando o Professor tem unidade fora do alcance do Administrador. Sem token, hash nem IP. Sem paginação (até 200).
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, ACTIVE, ENDED] } }
      responses:
        '200':
          description: Equipe, em ordem de nome.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StaffUser' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Convida alguém da gestão (RF-ACE-06, RN-ACE-05). Coordenador convida Administrador; Administrador convida Professor.
      description: |
        O perfil nunca vem do corpo (um `role` enviado é ignorado). O Administrador só convida para unidades dele (senão 403); unidade de
        outra organização ou inativa responde 400. E-mail já ligado a esta organização no mesmo perfil, com vínculo `PENDING` ou `ACTIVE`,
        responde 409 `ALREADY_LINKED`; conta desativada, 403. Acima de 200 usuários da gestão, 409 `STAFF_LIMIT_REACHED` (RN-ORG-05).
        Grava `invite.created` na auditoria, sem o e-mail nem o código.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StaffInvite' } } }
      responses:
        '201':
          description: Convite enviado; a linha nasce `PENDING`.
          content: { application/json: { schema: { $ref: '#/components/schemas/StaffUser' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/coordinator-appointment:
    post:
      summary: O Coordenador se nomeia Administrador de unidades (RN-ORG-07). Só o Coordenador.
      description: |
        Cria, ou reativa, para a própria conta um vínculo `ACTIVE` de Administrador nas unidades ativas indicadas, para destravar o
        409 `LAST_UNIT_ADMINISTRATOR`. Idempotente (um vínculo só; as unidades se somam). Sem unidade, ou com unidade inativa ou de outra
        organização, 400. Grava `link.coordinator_appointed`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StaffUnits' } } }
      responses:
        '200':
          description: O vínculo de Administrador do Coordenador.
          content: { application/json: { schema: { $ref: '#/components/schemas/StaffUser' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{linkId}/resend:
    post:
      summary: Reenvia o convite de um vínculo pendente (RF-ACE-06, RN-ACE-13).
      description: |
        Cancela o convite anterior e envia outro; no máximo 3 reenvios por dia por pessoa (429 `TOO_MANY_REQUESTS` além disso).
        Vínculo que não é `PENDING`, de outro perfil, de outra organização ou fora do alcance responde 404. Grava `invite.resent`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Convite reenviado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: Limite de reenvios do dia (TOO_MANY_REQUESTS).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /users/{linkId}/units:
    put:
      summary: Troca as unidades de um vínculo pendente ou ativo (RF-ACE-06).
      description: |
        O Coordenador define a lista inteira de um Administrador. O Administrador mexe só nas unidades dele num Professor; as demais do
        Professor ficam. Lista vazia ou que deixaria o vínculo sem unidade: 400; unidade fora do alcance de quem chama: 403; unidade de outra
        organização ou inativa: 400. Tirar a unidade do último Administrador ativo de uma unidade ativa responde 409 `LAST_UNIT_ADMINISTRATOR`
        (`fields`, campo `unitIds`, traz os ids separados por vírgula). Vínculo fora do alcance ou do perfil gerido: 404. Grava `link.units_changed`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StaffUnits' } } }
      responses:
        '200':
          description: A linha atualizada.
          content: { application/json: { schema: { $ref: '#/components/schemas/StaffUser' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{linkId}:
    delete:
      summary: Desativa o vínculo (RF-ACE-06, RN-ACE-20); a conta e os vínculos em outras organizações ficam.
      description: |
        Vínculo `ACTIVE` vira `ENDED` (as sessões acabam se era o último vínculo de gestão); `PENDING` tem o convite cancelado. Ninguém desativa
        a si mesmo (409 `CONFLICT`) nem o Coordenador (403). O Administrador só desativa Professor cujas unidades estejam todas entre as dele (403).
        Desativar o último Administrador ativo de uma unidade ativa responde 409 `LAST_UNIT_ADMINISTRATOR`. Alvo de outra organização ou perfil: 404.
        Grava `link.ended` ou `invite.canceled`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Vínculo desativado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /benefits:
    get:
      summary: Tabela de benefícios da organização do vínculo ativo (RF-BEN-01). Coordenador e Administrador.
      description: |
        Ordenada por nome do aluno e modalidade. O Coordenador vê todas as unidades; o Administrador, as das matrículas dele (`unitId` fora do
        alcance devolve lista vazia). Professor, Aluno e Responsável recebem 403. `status` é calculado: `EXPIRED` quando ativo com validade anterior
        a hoje no fuso da unidade. `high` (RN-BEN-06): bolsa acima de 50% ou desconto acima de metade do plano. `value` é percentual inteiro (1 a 100)
        em `PERCENT` e centavos em `AMOUNT`; `monthlyValueCents` nunca é negativo (RN-BEN-07). `q` ignora acento e maiúsculas; os filtros combinam (E).
        Só leitura: não grava auditoria.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [PERCENT, AMOUNT] } }
        - { name: modalityId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACTIVE, EXPIRED, ENDED] } }
        - { name: high, in: query, required: false, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Página de benefícios.
          content: { application/json: { schema: { $ref: '#/components/schemas/BenefitList' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Concede o benefício a uma modalidade da matrícula (RF-BEN-02). Coordenador e Administrador.
      description: |
        Grava o benefício `ACTIVE` na modalidade ativa do aluno. `type` `PERCENT` (inteiro de 1 a 100) ou `AMOUNT` (centavos inteiros de 1 a 99999999);
        `reason` de 2 a 200 e `decidedBy` de 2 a 80 caracteres; `validUntil` nulo ou de hoje em diante no fuso da unidade. O lançador é a conta da
        sessão (campos extras são ignorados). Havendo benefício ativo na modalidade, só com `replaceExisting` verdadeiro: o atual é encerrado
        ("Substituído por novo benefício") na mesma transação; senão 409 e nada muda. Grava `benefit.granted` (e `benefit.ended`). O Administrador
        só concede em unidade dele (senão 403); aluno ou modalidade inexistente, encerrada, de outro aluno ou de outra organização: 404.
        Não altera cobrança.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BenefitInput' } } }
      responses:
        '201':
          description: Benefício concedido.
          content: { application/json: { schema: { $ref: '#/components/schemas/BenefitRow' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /benefits/{id}/end:
    post:
      summary: Encerra o benefício (RF-BEN-03). Coordenador e Administrador.
      description: |
        Define `status` `ENDED` com `ended_at` agora e `end_reason` o motivo (`reason` de 2 a 200 caracteres); só a linha do benefício muda e o
        encerramento vale a partir da próxima cobrança gerada. Benefício vencido pode ser encerrado; já encerrado: 409. Grava `benefit.ended`.
        O Administrador só encerra em unidade dele (senão 403); inexistente ou de outra organização: 404. Dois pedidos simultâneos: um 200 e um 409.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BenefitEndInput' } } }
      responses:
        '200':
          description: Benefício encerrado.
          content: { application/json: { schema: { $ref: '#/components/schemas/BenefitRow' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /benefits/preview:
    post:
      summary: Resumo antes de conceder o benefício (RF-BEN-02). Coordenador e Administrador.
      description: |
        Recebe `studentId`, `modalityRowId`, `type` e `value` (mesmas regras de `POST /benefits`) e devolve o plano da modalidade, o benefício ativo
        atual (nulo se não há), a nova mensalidade (nunca negativa), o mês `AAAA-MM` em que vale (primeiro vencimento depois de hoje + 10 dias, no
        fuso da unidade), `replaces` e `high`. Não grava nem audita. Mesmas permissões, alcance e 404 da concessão.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BenefitPreviewInput' } } }
      responses:
        '200':
          description: Resumo.
          content: { application/json: { schema: { $ref: '#/components/schemas/BenefitPreview' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plans:
    get:
      summary: Tabela de planos da organização do vínculo ativo (RF-PLA-02). Coordenador e Administrador.
      description: |
        Ordenada por modalidade e nome. O Coordenador vê todas as unidades; o Administrador, as dele (`unitId` fora do alcance devolve lista
        vazia). Professor, Aluno e Responsável recebem 403. Sem `status` traz `ACTIVE` e `INACTIVE`. `q` ignora acento e maiúsculas; os filtros
        combinam (E). `valueCents` em centavos inteiros; `weeklyFrequency` nulo é livre e só informa (RN-PLA-02). `studentsUsing` vale 0 até a
        Sprint 07. Só leitura: não grava auditoria.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: modalityId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACTIVE, INACTIVE] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Página de planos.
          content: { application/json: { schema: { $ref: '#/components/schemas/PlanList' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Cria o plano (RF-PLA-03). Coordenador e Administrador.
      description: |
        Cria plano mensal ativo numa unidade ativa, com modalidade ativa na unidade. `name` de 2 a 60 caracteres; `valueCents` inteiro de 1 a
        99999999; `weeklyFrequency` 2, 3 ou nulo (livre), só informativo (RN-PLA-02). Nome repetido entre os ativos da mesma unidade e modalidade
        (sem acento nem caixa): 409. O Administrador só cria em unidade dele (senão 403). `validOtherUnits` só vale com `crossUnitTraining`
        `plan` na organização; nos outros casos o servidor grava `false`. Grava a primeira linha do histórico de valor e `plan.created`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlanInput' } } }
      responses:
        '201':
          description: Plano criado.
          content: { application/json: { schema: { $ref: '#/components/schemas/PlanRow' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /plans/summary:
    get:
      summary: Resumo de planos e benefícios (RF-PLA-01). Coordenador e Administrador.
      description: |
        `plans` traz `active`, `inactive`, `studentsUsing` e a faixa de valores (`minValueCents`, `maxValueCents`, só dos planos ativos; nulos sem plano
        ativo); `benefits` traz `active` e `high`. `studentsUsing` vale 0 até a matrícula alimentar a contagem; `benefits` conta os benefícios ativos não vencidos e, entre eles, os altos (RF-BEN-01). O Coordenador vê todas as unidades ou a de
        `unitId`; o Administrador, as dele (`unitId` fora do alcance devolve resumo zerado). Professor, Aluno e Responsável recebem 403. Só leitura:
        não grava auditoria.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resumo.
          content: { application/json: { schema: { $ref: '#/components/schemas/PlanSummary' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /plans/options:
    get:
      summary: Opções da janela de plano (RF-PLA-03). Coordenador e Administrador.
      description: |
        Unidades ativas do alcance, cada uma com as modalidades ativas que oferece, e `crossUnitTraining` da organização (`plan`, `allowed` ou
        `denied`; RN-ORG-13). Só leitura: não grava auditoria.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Opções.
          content: { application/json: { schema: { $ref: '#/components/schemas/PlanOptions' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /plans/{id}:
    put:
      summary: Altera o plano (RF-PLA-03). Coordenador e Administrador.
      description: |
        Altera `name`, `valueCents`, `weeklyFrequency` e `validOtherUnits`; `unitId` e `modalityId`, se enviados, têm de ser os atuais (senão 400).
        Plano desativado: 409. Id de outra organização ou fora do alcance: 404. Com valor diferente, grava nova linha de histórico e aceita
        `unpaidCharges` (`KEEP` padrão, `ADJUST`) e `paidFutureDifference` (`false` padrão); as escolhas vão para a auditoria `plan.updated`
        e, até haver cobrança, nenhuma cobrança é alterada. Sem mudança de valor as escolhas são ignoradas. Não há rota de exclusão.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlanInput' } } }
      responses:
        '200':
          description: Plano alterado.
          content: { application/json: { schema: { $ref: '#/components/schemas/PlanRow' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /plans/{id}/value-impact:
    get:
      summary: Impacto de mudar o valor do plano (RN-PLA-04). Coordenador e Administrador.
      description: |
        `studentsAffected` vale 0 até a Sprint 07; `effectiveFrom` é `NEXT_CHARGE` (a próxima cobrança gerada; cobrança paga não muda).
        `valueCents` ausente ou fora de 1 a 99999999: 400. Só leitura: não grava auditoria.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: valueCents, in: query, required: true, schema: { type: integer, format: int64, minimum: 1, maximum: 99999999 } }
      responses:
        '200':
          description: Impacto.
          content: { application/json: { schema: { $ref: '#/components/schemas/PlanValueImpact' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plans/{id}/deactivate:
    post:
      summary: Desativa o plano (RN-PLA-06). Coordenador e Administrador.
      description: |
        Só muda `status` para `INACTIVE`; nada é apagado e o plano continua na lista. Repetir responde 200 sem mudar nem auditar.
        Grava `plan.deactivated`. Sem corpo.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Plano com `status` `INACTIVE`.
          content: { application/json: { schema: { $ref: '#/components/schemas/PlanRow' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plans/{id}/activate:
    post:
      summary: Reativa o plano (RN-PLA-06). Coordenador e Administrador.
      description: |
        Volta `status` para `ACTIVE`. Com outro plano ativo de mesmo nome na unidade e modalidade, 409. Repetir responde 200 sem mudar nem
        auditar. Grava `plan.activated`. Sem corpo.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Plano com `status` `ACTIVE`.
          content: { application/json: { schema: { $ref: '#/components/schemas/PlanRow' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /students:
    get:
      summary: Lista paginada de alunos da organização do vínculo ativo (RF-ALU-01). Coordenador e Administrador.
      description: |
        Ordenada por nome (sem acento nem caixa) e depois id (`sort=name`). O Coordenador vê todos; o Administrador só os alunos
        dentro das suas unidades (RN-ALU-07: o aluno com modalidade, ativa ou encerrada, numa unidade do alcance; sem nenhuma, a unidade de cadastro); `unitId` fora do alcance dele devolve lista vazia; `unitId` ou `classId` que não existe na organização, 404. A linha traz `status` e as `modalities` ativas (RF-ALU-01); `counts` traz as contagens de `status=ACTIVE` e `status=FORMER`. Professor, Aluno e
        Responsável recebem 403. `q` ignora acento e maiúsculas; `ageRangeId` devolve quem tem hoje idade dentro da faixa (`minAge` até `maxAge`,
        sem teto quando nulo); faixa de outra organização, 404. Os filtros combinam (E). `ageRange` da linha é a faixa de maior `minAge` que cobre a
        idade, ou nulo. `photoUrl` é uma URL temporária assinada. `seals` são os selos calculados na leitura (RF-ALU-02), em ordem fixa; `seal` filtra por
        um deles (E com os demais; valor desconhecido, 400). A resposta nunca traz CPF, e-mail, telefone, endereço nem contato de emergência.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: unitId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: ageRangeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: seal, in: query, required: false, schema: { $ref: '#/components/schemas/StudentSeal' } }
        - { name: modalityId, in: query, required: false, schema: { type: string, format: uuid }, description: Quem tem esta modalidade ativa. }
        - { name: classId, in: query, required: false, schema: { type: string, format: uuid }, description: "Quem tem a turma como principal ou outro horário numa modalidade ativa; turma inexistente ou de outra organização dá 404." }
        - { name: levelId, in: query, required: false, schema: { type: string, format: uuid }, description: Nível de graduação; aceito e sem resultado até a graduação. }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACTIVE, FORMER] }, description: Filtro rápido Ativos ou Ex-alunos. }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { name: sort, in: query, required: false, description: Só `name`., schema: { type: string, enum: [name] } }
      responses:
        '200':
          description: Página de alunos.
          content: { application/json: { schema: { $ref: '#/components/schemas/StudentList' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Cadastra o aluno (RF-ALU-01). Coordenador e Administrador.
      description: |
        Cria o aluno na organização da sessão, com a unidade de cadastro `registeredUnitId` (ativa; o Administrador só as dele, senão 403;
        de outra organização ou inativa, 400). CPF só com dígitos e dígitos verificadores. Adulto (18 anos ou mais) informa CPF, e-mail e
        celular próprios; menor precisa de ao menos um e no máximo dois `guardians` (CPF, e-mail e celular do responsável), com exatamente
        um financeiro (com um só, ele é o financeiro). Cada responsável novo recebe conta `INVITED`, vínculo `GUARDIAN` pendente e o próprio
        convite; e-mail já cadastrado reaproveita conta e cadastro. Campo fora do contrato (como dado de saúde) é ignorado e não é gravado.
        CPF já cadastrado na organização: 409 `STUDENT_CPF_EXISTS`; sem CPF, mesmo nome e nascimento: 409 `STUDENT_POSSIBLE_DUPLICATE`,
        repetível com `confirmDuplicate` igual a `true`; os dois trazem em `fields` só `id`, `name` e `photoUrl` do existente. CPF ou e-mail
        de responsável em conflito com outro: 409 `GUARDIAN_CONFLICT`. Grava `student.created` e `student.guardian_linked`, sem CPF, e-mail,
        telefone nem endereço.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StudentInput' } } }
      responses:
        '201':
          description: Aluno criado.
          content: { application/json: { schema: { $ref: '#/components/schemas/StudentDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Duplicidade ou conflito (STUDENT_CPF_EXISTS, STUDENT_POSSIBLE_DUPLICATE, GUARDIAN_CONFLICT).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /students/birthdays:
    get:
      summary: Aniversariantes de hoje (RF-ALU-06). Administrador e Professor.
      description: >-
        Alunos que fazem aniversário hoje (29/02 vale em 28/02 nos anos não bissextos), por nome, sem paginação. Administrador vê as unidades do
        alcance dele; Só quem tem modalidade ativa; o Professor, só os de turma ativa dele. O contato do Professor só vem com "ver contatos" ligado na unidade da turma do aluno. Só lê; não audita.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Lista do dia.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StudentBirthday' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /students/lookup:
    get:
      summary: Busca o aluno pelo CPF ou pelo e-mail (RN-ALU-06, RN-MAT-19). Coordenador e Administrador.
      description: Informe `cpf` ou `email`, só um dos dois (nenhum ou os dois, 400). Devolve só `id`, `name`, `photoUrl` e `enrollmentStatus` (`NONE`, `ACTIVE`, `FORMER`) do aluno da organização, de qualquer unidade; nenhum outro dado.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: cpf, in: query, required: false, schema: { type: string }, description: CPF com ou sem máscara. }
        - { name: email, in: query, required: false, schema: { type: string }, description: E-mail do aluno. }
      responses:
        '200':
          description: Aluno encontrado.
          content: { application/json: { schema: { $ref: '#/components/schemas/StudentLookup' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /students/simple:
    get:
      summary: Lista simples dos alunos de uma turma ou aula (R22). Professor, Coordenador e Administrador.
      description: >-
        Informe `classId` ou `lessonId`, só um dos dois (senão 400). Devolve os alunos ativos da turma (principal ou outro horário), por nome, só com
        `id`, `name`, `photoUrl`, `belt` e `blocked`: nunca CPF, contato, valores nem selos. O Professor vê a lista da turma em que é titular ou auxiliar e da
        aula dele, sem depender das chaves do Professor; turma ou aula de outro, 404. A gestão vê as turmas das unidades do alcance (Administrador fora do alcance, 404).
        Aluno e Responsável recebem 403.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: classId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: lessonId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Lista simples.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StudentSimple' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /students/{id}:
    get:
      summary: Detalhe do aluno com os responsáveis (RF-ALU-01). Coordenador e Administrador.
      description: Administrador só alcança o aluno cuja unidade de cadastro está no alcance dele; fora disso, 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Aluno.
          content: { application/json: { schema: { $ref: '#/components/schemas/StudentDetail' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Edita os dados pessoais do aluno (RF-ALU-04). Coordenador e Administrador.
      description: |
        Substitui os dados pessoais (mesmos campos e validações do cadastro, sem unidade de cadastro nem responsáveis). Menor de 18 anos
        precisa de ao menos um responsável já vinculado (400 em `birthDate`). CPF de outro aluno: 409 `STUDENT_CPF_EXISTS`; sem CPF, nome ou
        nascimento mudados para os de outro aluno: 409 `STUDENT_POSSIBLE_DUPLICATE`, repetível com `confirmDuplicate` igual a `true`; os dois
        trazem em `fields` só `id`, `name` e `photoUrl` do existente. Campo fora do contrato é ignorado. Fora do alcance do Administrador, 404.
        Grava `student.updated` com antes e depois só dos campos não pessoais; sem mudança, nada é gravado.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StudentUpdate' } } }
      responses:
        '200':
          description: Aluno atualizado.
          content: { application/json: { schema: { $ref: '#/components/schemas/StudentDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Duplicidade (STUDENT_CPF_EXISTS, STUDENT_POSSIBLE_DUPLICATE).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /students/{id}/photo:
    put:
      summary: Troca a foto do aluno (RF-ALU-04). Coordenador e Administrador.
      description: |
        Campo `file` com PNG, JPEG ou WebP, exatamente 512 x 512 px e até 5 MB, conferido pelo conteúdo. Erro: 400 (campo `file`) e a foto
        anterior permanece. O arquivo antigo é apagado. Fora do alcance do aluno, 404. Grava `student.photo_updated`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Foto trocada.
          content: { application/json: { schema: { $ref: '#/components/schemas/StudentDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
    delete:
      summary: Remove a foto do aluno (RF-ALU-04). Coordenador e Administrador.
      description: Apaga o arquivo e grava `student.photo_removed`; sem foto, repete sem erro e sem auditoria.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Foto removida.
          content: { application/json: { schema: { $ref: '#/components/schemas/StudentDetail' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /students/{id}/record:
    get:
      summary: Ficha do aluno (RF-ALU-03). Coordenador e Administrador; Professor com a chave "ver ficha do aluno".
      description: |
        Administrador só alcança o aluno do seu alcance (RN-ALU-07); fora dele, 404. Professor sem a chave em nenhuma unidade dele recebe
        403; com a chave, só abre aluno de turma ativa dele, titular ou auxiliar, com a modalidade ativa ligada à turma (outro aluno: 404); as chaves valem na unidade da turma (desligada lá: 403). A ficha do Professor omite `birthDate`, `seals`,
        `cpf`, `address` e, nos responsáveis, `financial` e `access`; `contact`, `emergency` e o telefone e e-mail dos responsáveis só com
        "ver contatos".
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ficha.
          content: { application/json: { schema: { $ref: '#/components/schemas/StudentRecord' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /students/{id}/history:
    get:
      summary: Histórico do aluno, da ação mais recente para a mais antiga (RF-ALU-03). Coordenador e Administrador.
      description: Registros de auditoria do aluno sem os valores antes e depois. Mesmo alcance da ficha; Professor 403.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Página do histórico.
          content: { application/json: { schema: { $ref: '#/components/schemas/StudentHistoryList' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /students/{id}/modalities:
    post:
      summary: Matricula o aluno em uma ou mais modalidades (RN-MAT-01, 02, 03, 04, 19). Coordenador e Administrador.
      description: |
        Cria a matrícula se o aluno não tem, acrescenta modalidades se tem, ou reabre a mesma matrícula do ex-aluno (todas as modalidades
        encerradas; `reopenedAt` passa a valer). Tudo ou nada. Cada modalidade exige unidade ativa e no alcance de quem chama (403 fora dele),
        modalidade ativa e oferecida pela unidade, turma principal ativa da unidade e da modalidade, `otherClassIds` opcional (turmas ativas da
        mesma unidade e modalidade, diferentes da principal), plano ativo da unidade e da modalidade e `dueDay` entre os dias da unidade; na unidade
        onde o aluno já tem modalidade ativa o dia é o dela (omitido, herda; diferente, 422). Até 10 modalidades ativas (422 em `modalities`); a mesma
        modalidade ativa duas vezes, 409; turma, plano ou unidade de outra organização, 404. Grava `student.enrolled` ou `student.enrollment_reopened` e
        `student.modality_added`, sem CPF, e-mail nem telefone.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentAdd' } } }
      responses:
        '201':
          description: A matrícula do aluno.
          content: { application/json: { schema: { $ref: '#/components/schemas/Enrollment' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: O aluno já tem esta modalidade ativa (CONFLICT).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Regra de negócio recusa o pedido (UNPROCESSABLE); `fields` traz o campo. Nada é gravado.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /students/{id}/modalities/{modalityRowId}/class:
    put:
      summary: Troca a turma principal e os outros horários de uma modalidade (RN-MAT-15). Coordenador e Administrador.
      description: |
        Vale na hora: a leitura seguinte já mostra a turma nova. Os outros horários enviados substituem os anteriores. As turmas seguem as regras da
        matrícula (ativas, da unidade e da modalidade da linha, outros horários diferentes da principal; 422). O Administrador só altera modalidade da
        sua unidade (403 nas demais, RN-ALU-07). Modalidade encerrada, de outro aluno ou de outra organização, 404. Grava `student.class_changed`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: modalityRowId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentClassChange' } } }
      responses:
        '200':
          description: A matrícula atualizada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Enrollment' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Regra de negócio recusa o pedido (UNPROCESSABLE); `fields` traz o campo. Nada muda.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /students/{id}/modalities/{modalityRowId}/plan:
    put:
      summary: Agenda a troca de plano de uma modalidade (RN-MAT-15). Coordenador e Administrador.
      description: |
        O plano novo fica em `nextPlan` e vale a partir da próxima cobrança gerada; `plan` não muda até lá. Trocar de novo antes substitui o
        agendamento; pedir o plano atual limpa o agendamento; pedir o plano atual sem agendamento, 422. O plano deve ser ativo, da unidade e da
        modalidade da linha (422). Administrador só na sua unidade (403). Grava `student.plan_changed`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: modalityRowId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentPlanChange' } } }
      responses:
        '200':
          description: A matrícula atualizada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Enrollment' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Regra de negócio recusa o pedido (UNPROCESSABLE); `fields` traz o campo. Nada muda.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /students/{id}/modalities/{modalityRowId}/transfer:
    post:
      summary: Transfere uma modalidade para outra unidade da organização (RN-MAT-20, RN-ORG-12). Coordenador e Administrador.
      description: |
        Mantém a mesma linha (histórico, graduação e data de início) com a unidade, a turma principal, os outros horários, o plano e o vencimento
        da unidade nova; o plano agendado é descartado. O dia de vencimento segue a regra da matrícula na unidade nova (herda o dia se o aluno já
        tem outra modalidade ativa lá). Unidade igual à atual, inativa, turma, plano ou vencimento da unidade antiga, 422; unidade de outra
        organização, 404. O Administrador precisa de alcance na origem e no destino (403). Cobranças já geradas ficam na unidade de origem.
        Grava `student.modality_transferred` com origem e destino.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: modalityRowId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentTransfer' } } }
      responses:
        '200':
          description: A matrícula atualizada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Enrollment' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Regra de negócio recusa o pedido (UNPROCESSABLE); `fields` traz o campo. Nada muda.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /students/{id}/enrollment/preview:
    post:
      summary: Prévia da nova matrícula (RF-MAT-01, RN-MAT-03, 05, 07). Coordenador e Administrador.
      description: |
        Calcula o resumo sem gravar nada (nenhuma matrícula, benefício, início de matrícula nem auditoria). Por modalidade: valor do plano, desconto do
        benefício e mensalidade. Por unidade: dia de vencimento, data da primeira cobrança (hoje no fuso da unidade, com 5 dias de tolerância), taxa de
        matrícula (0 se a unidade não cobra, se o aluno já teve modalidade ali sem ser retorno, ou se isentada), total da primeira cobrança e data
        da segunda cobrança (sugerida ou a escolhida). Exige `STUDENT_MANAGE` em cada unidade (403); aluno, unidade, turma ou plano de outra
        organização, 404. Isenção sem motivo de 3 a 200 caracteres ou em unidade sem taxa, 422 `feeExemptReason`; segunda cobrança fora de 15 a 60 dias
        da matrícula, 422 `secondDueOn`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentConclusionRequest' } } }
      responses:
        '200':
          description: O resumo.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentPreview' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Regra de negócio recusa o pedido (UNPROCESSABLE); `fields` traz o campo.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /students/{id}/enrollment/class-warnings:
    get:
      summary: Avisos da turma na matrícula (RF-MAT-02, RN-MOD-07, RN-TUR-02). Coordenador e Administrador.
      description: |
        Só lê (nada é gravado nem auditado). `ageOutOfRange` é verdadeiro quando a turma tem faixa etária e a idade do aluno hoje, no fuso da unidade
        da turma, é menor que a mínima ou maior que a máxima (RN-ORG-17). `overCapacity` é verdadeiro quando a turma tem capacidade e os alunos ativos
        mais esta matrícula passam dela; aluno já ativo na turma não conta de novo. Os avisos nunca impedem a matrícula. Exige `STUDENT_MANAGE` na
        unidade da turma (403); aluno ou turma de outra organização, 404; `classId` ausente ou inválido, 400.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: classId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Os avisos.
          content: { application/json: { schema: { $ref: '#/components/schemas/ClassWarnings' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /students/{id}/enrollment/conclude:
    post:
      summary: Conclui a nova matrícula (RF-MAT-01, RN-MAT-04, 08, 09, 12). Coordenador e Administrador.
      description: |
        Grava tudo ou nada: as modalidades (mesmas regras de `POST /students/{id}/modalities`), o benefício de cada modalidade que trouxer `benefit`
        (mesmas regras de `POST /benefits`), a graduação de origem (`origin`, só em modalidade com graduação ligada; com a exigência de comprovante
        ligada, `origin.proofKey` é obrigatório, 422; nível de outra modalidade, grau acima do máximo ou data futura, 422), e por unidade a taxa
        a cobrar ou a isenção com motivo e a data da segunda cobrança (`enrollment_start`, para a Sprint 08; nenhuma cobrança nasce aqui). Ao concluir
        o aluno está Ativo. O aluno adulto com e-mail e sem conta ativa recebe o convite do portal depois do commit (`inviteStatus` `SENT`, ou
        `FAILED` se o envio falhou, sem desfazer a matrícula); menor não recebe convite próprio (`MINOR`); conta ativa (`EXISTING_ACCOUNT`) e sem
        e-mail (`NO_EMAIL`) também não. `termPending` é sempre `true`: o aceite do termo é da #85. Repetir a conclusão: 409 pela modalidade já ativa,
        sem mudar nada. Grava `student.enrolled` (ou `student.enrollment_reopened`), `student.modality_added`, `benefit.granted`,
        `student.origin_graduation_registered` e `enrollment.fee_exempted`, sem CPF, e-mail nem chave de arquivo.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentConclusionRequest' } } }
      responses:
        '201':
          description: A matrícula, o resumo e o estado do convite.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentConcluded' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: O aluno já tem uma das modalidades ativas (CONFLICT).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Regra de negócio recusa o pedido (UNPROCESSABLE); `fields` traz o campo. Nada é gravado.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /students/{id}/enrollment/origin-proof:
    post:
      summary: Envia o comprovante da graduação de origem (RN-GRA-09, RN-MAT-09). Coordenador e Administrador.
      description: |
        Campo `file` com JPG, PNG, WebP ou PDF de até 5 MB, conferido pelo conteúdo (422 no campo `file`). Guarda o arquivo na pasta da organização
        com nome gerado no servidor e devolve `proofKey`, que a conclusão referencia; a conclusão só aceita chave do mesmo aluno e da mesma organização.
        Aluno fora do alcance ou de outra organização, 404. Grava `student.origin_proof_uploaded`, sem a chave.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Comprovante guardado.
          content: { application/json: { schema: { $ref: '#/components/schemas/OriginProofStored' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: Tipo ou tamanho recusado (UNPROCESSABLE), campo `file`.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /students/{id}/enrollment:
    get:
      summary: Matrícula do aluno com as modalidades (RN-MAT-01, 02). Coordenador e Administrador.
      description: |
        Aluno sem matrícula: 200 com `status` `NONE` e lista vazia. `status` é calculado das modalidades: `ACTIVE` (ao menos uma ativa) ou `FORMER`.
        `canEdit` diz se quem chama altera a modalidade (Administrador só a das suas unidades).
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: A matrícula.
          content: { application/json: { schema: { $ref: '#/components/schemas/Enrollment' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /students/{id}/guardians:
    post:
      summary: Liga um responsável ao aluno (RN-RSP-02, RN-RSP-06). Coordenador e Administrador.
      description: |
        Corpo com os dados do responsável, `financial` (opcional; o primeiro responsável é sempre o financeiro; `true` passa o financeiro
        ao novo) e `reason` obrigatório (3 a 200 caracteres). Terceiro responsável: 409 `GUARDIAN_LIMIT`; o mesmo responsável já ligado,
        409; CPF e e-mail em conflito com outro cadastro, 409 `GUARDIAN_CONFLICT`. Grava `student.guardian_linked` com o motivo.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StudentGuardianInput' } } }
      responses:
        '200':
          description: Aluno com os responsáveis atualizados.
          content: { application/json: { schema: { $ref: '#/components/schemas/StudentDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Limite, conflito ou responsável já ligado (GUARDIAN_LIMIT, GUARDIAN_CONFLICT, CONFLICT).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /students/{id}/guardians/{guardianId}:
    put:
      summary: Passa o financeiro a este responsável (RN-RSP-02). Coordenador e Administrador.
      description: Só `financial` igual a `true` existe; `false` sozinho dá 400. Grava `student.guardian_financial_changed`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: guardianId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [financial]
              properties:
                financial: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Aluno com os responsáveis atualizados.
          content: { application/json: { schema: { $ref: '#/components/schemas/StudentDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /students/{id}/guardians/{guardianId}/unlink:
    post:
      summary: Desliga o responsável do aluno (RN-RSP-05). Coordenador e Administrador.
      description: |
        `reason` obrigatório (3 a 200 caracteres), só na auditoria (`student.guardian_unlinked`). Último responsável de aluno menor:
        409 `MINOR_NEEDS_GUARDIAN`. Desligar o financeiro havendo outro passa o financeiro ao que fica. O desligado recebe e-mail neutro,
        sem nome do aluno nem motivo; sem aluno nenhum na organização, o vínculo `GUARDIAN` termina e o convite pendente é cancelado.
        O aluno e o histórico nunca são excluídos.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: guardianId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '200':
          description: Aluno com os responsáveis atualizados.
          content: { application/json: { schema: { $ref: '#/components/schemas/StudentDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Último responsável de menor (MINOR_NEEDS_GUARDIAN).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /students/{id}/guardians/{guardianId}/invite:
    post:
      summary: Reenvia o convite pendente do responsável (RN-RSP-05, RN-ACE-13). Coordenador e Administrador.
      description: |
        Invalida o convite anterior; no máximo 3 reenvios por dia (429). Acesso já ativo: 409. Grava `student.guardian_invite_resent`.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: guardianId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Convite reenviado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: Limite de reenvios do dia (TOO_MANY_REQUESTS).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /portal/students:
    get:
      summary: Cartões dos alunos do portal (RN-RSP-03, RN-LGP-03). Responsável e Aluno.
      description: |
        Um cartão por aluno ligado ao responsável da sessão (em qualquer unidade da organização) e, se a conta também é a de um aluno, o
        cartão dele com `self` igual a `true`. Só `id`, `name`, `photoUrl` e `self`. Sessão de gestão ou de Professor: 403.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Cartões, o próprio primeiro.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PortalStudentCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Cookie de sessão (login na #18).
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Obrigatório em operações que alteram dado.
  parameters:
    Page:
      name: page
      in: query
      description: Página, a partir de 1.
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      description: Itens por página.
      schema: { type: integer, enum: [25, 50, 100], default: 25 }
    Sort:
      name: sort
      in: query
      description: "Ordenação `campo,asc|desc`; só campos que a rota declara."
      schema: { type: string, example: "name,asc" }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, format: password }
        challengeToken: { type: string, description: Desafio invisível (porta ChallengeVerifier). }
    AcceptInviteRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, description: Senha nova (conta nova) ou a senha que a pessoa já tem (conta existente). }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }
        challengeToken: { type: string }
    PasswordResetBody:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password }
    Access:
      type: string
      description: "Nível da célula: FULL (pode), READ (só consulta), OWN (o próprio resumo), NOTICE (faixa de aviso), NONE (não acessa)."
      enum: [FULL, READ, OWN, NOTICE, NONE]
    Permission:
      type: string
      description: Linha "Área / ação" da tabela de permissões, na ordem da especificação.
      enum: [HOME, ALL_UNITS_CONSOLIDATED, STUDENT_VIEW, STUDENT_RECORD, STUDENT_CONTACTS, STUDENT_MANAGE, BENEFITS, PLANS, COLLECTIONS, CHARGE_ADJUSTMENTS, CLASSES_MANAGE, AGENDA_VIEW, AGENDA_EDIT, NO_CLASS_DAYS, GRADUATION, ANNOUNCEMENTS, TRIAL_CLASSES, TEACHERS, STAFF_USERS, UNIT_SETTINGS, ORGANIZATION_SETTINGS, UNITS, SUBSCRIPTION, AUDIT, REPORTS, EXPORT_LISTS, EXPORT_FULL, IMPORT, SUPPORT_ACCESS]
    PermissionsView:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: object
          description: Uma chave `Permission` por linha da tabela, com o nível `Access` do vínculo ativo.
          additionalProperties: { $ref: '#/components/schemas/Access' }
    SelectLinkRequest:
      type: object
      required: [linkId]
      properties:
        linkId: { type: string, format: uuid }
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    AccountView:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string, nullable: true }
    LinkView:
      type: object
      required: [id, organizationId, organizationName, role, unitIds]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string, description: Nome da organização do vínculo (só de vínculos da própria conta). }
        role: { type: string, enum: [COORDINATOR, ADMINISTRATOR, TEACHER, STUDENT, GUARDIAN] }
        unitIds:
          type: array
          items: { type: string, format: uuid }
    TwoFactorRequired:
      type: object
      required: [twoFactorRequired, ticket]
      properties:
        twoFactorRequired: { type: boolean, enum: [true] }
        ticket: { type: string, description: "Bilhete de uso único, 5 minutos, para POST /auth/login/two-factor." }
    TwoFactorLoginRequest:
      type: object
      required: [ticket, code]
      properties:
        ticket: { type: string }
        code: { type: string, description: Código TOTP de 6 dígitos ou código de reserva. }
    TwoFactorSetup:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, description: "Segredo em base32, para digitar no app." }
        otpauthUri: { type: string, description: "Endereço otpauth://totp/... para o QR code." }
    TwoFactorCode:
      type: object
      required: [code]
      properties:
        code: { type: string, description: Código TOTP de 6 dígitos. }
    PasswordAndCode:
      type: object
      required: [password, code]
      properties:
        password: { type: string, format: password }
        code: { type: string, description: Código TOTP ou de reserva. }
    BackupCodes:
      type: object
      required: [backupCodes]
      properties:
        backupCodes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string, description: "10 caracteres sem ambiguidade; uso único." }
    ReauthRequest:
      type: object
      required: [action, password]
      properties:
        action: { type: string, enum: [TRANSFER_COORDINATION, CANCEL_SUBSCRIPTION, FULL_EXPORT, DISCONNECT_MERCADO_PAGO, ANONYMIZE_STUDENT, DEACTIVATE_UNIT] }
        password: { type: string, format: password }
        code: { type: string, description: Obrigatório quando as duas etapas estão ligadas. }
    EmailChangeRequest:
      type: object
      required: [newEmail, password]
      properties:
        newEmail: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password }
        code: { type: string, description: Obrigatório quando as duas etapas estão ligadas. }
    AccountSession:
      type: object
      required: [id, device, createdAt, lastUsedAt, current]
      properties:
        id: { type: string, format: uuid }
        device: { type: string, description: "Rótulo do aparelho, não o texto bruto do navegador." }
        city: { type: string, nullable: true, description: Cidade aproximada quando conhecida. }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }
    ReauthToken:
      type: object
      required: [reauthToken, expiresAt]
      properties:
        reauthToken: { type: string }
        expiresAt: { type: string, format: date-time }
    TwoFactorState:
      type: object
      required: [enabled, required]
      properties:
        enabled: { type: boolean }
        required: { type: boolean, description: "Verdadeiro para quem tem vínculo ativo de Coordenador; sem as duas etapas a sessão só alcança a configuração (403 TWO_FACTOR_SETUP_REQUIRED nas demais rotas)." }
    SessionView:
      type: object
      required: [account, links, twoFactor]
      properties:
        account: { $ref: '#/components/schemas/AccountView' }
        links:
          type: array
          items: { $ref: '#/components/schemas/LinkView' }
        activeLinkId:
          type: string
          format: uuid
          nullable: true
          description: Vazio quando a conta tem mais de um vínculo e ainda não escolheu (PUT /auth/session/link).
        twoFactor: { $ref: '#/components/schemas/TwoFactorState' }
    InviteInfo:
      type: object
      required: [role, existingAccount, organizationId, email, expiresAt]
      properties:
        email: { type: string, description: "E-mail do convite (só para código válido)." }
        name: { type: string, nullable: true, description: "Nome informado no convite." }
        expiresAt: { type: string, format: date-time, description: "Vencimento do convite." }
        role: { type: string, enum: [COORDINATOR, ADMINISTRATOR, TEACHER, STUDENT, GUARDIAN] }
        existingAccount: { type: boolean, description: Verdadeiro quando a pessoa já tem senha e aceita com ela. }
        organizationId: { type: string, format: uuid }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    Error:
      type: object
      required: [code, message, changed, fields, traceId]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - MALFORMED_REQUEST
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - CONFLICT
            - UNPROCESSABLE
            - EDIT_CONFLICT
            - PRECONDITION_REQUIRED
            - UNIT_LIMIT_REACHED
            - UNIT_HAS_BLOCKERS
            - LAST_UNIT_ADMINISTRATOR
            - MODALITY_IN_USE
            - UNIT_MODALITY_IN_USE
            - TEACHER_MODALITY_IN_USE
            - MODALITY_NOT_ACTIVE
            - REQUEST_ALREADY_OPEN
            - ALREADY_IN_CATALOG
            - AGE_RANGE_NAME_TAKEN
            - STAFF_LIMIT_REACHED
            - ALREADY_LINKED
            - HAS_PRIMARY_STUDENTS
            - UNSUPPORTED_MEDIA_TYPE
            - INVALID_CREDENTIALS
            - TOO_MANY_REQUESTS
            - CHALLENGE_FAILED
            - INVITE_INVALID
            - RESET_LINK_INVALID
            - PASSWORD_WEAK
            - PASSWORD_LEAKED
            - MINOR_HAS_NO_ACCOUNT
            - STUDENT_CPF_EXISTS
            - STUDENT_POSSIBLE_DUPLICATE
            - MINOR_NEEDS_GUARDIAN
            - GUARDIAN_LIMIT
            - GUARDIAN_CONFLICT
            - INVALID_TWO_FACTOR_CODE
            - TWO_FACTOR_TICKET_INVALID
            - TWO_FACTOR_SETUP_REQUIRED
            - REAUTH_REQUIRED
            - EMAIL_CHANGE_INVALID
            - SESSION_CURRENT
            - INTERNAL_ERROR
        message: { type: string }
        changed: { type: boolean }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        traceId: { type: string }
    OrganizationView:
      type: object
      required: [name, color, holderDocument, logoUrl, version, lastChange]
      properties:
        version: { type: integer, minimum: 0, description: 'Versão para o If-Match da próxima gravação (RNF-15).' }
        lastChange: { $ref: '#/components/schemas/LastChange' }
        name: { type: string, minLength: 1, maxLength: 120 }
        color: { type: string, nullable: true, pattern: '^#[0-9a-f]{6}$', description: 'Cor principal (contraste mínimo 4,5:1 com texto branco); nula usa a cor padrão da plataforma.' }
        holderDocument: { type: string, nullable: true, pattern: '^([0-9]{11}|[0-9]{14})$', description: 'CPF ou CNPJ do titular, só dígitos.' }
        logoUrl: { type: string, nullable: true, description: 'URL temporária assinada da logo (512 x 512); nula sem logo.' }
    LastChange:
      type: object
      nullable: true
      description: 'Última alteração de configuração da entidade, tirada da auditoria (RF-ORG-08); nula sem registro. `by` é o nome da pessoa, ou o e-mail se não houver nome; nulo quando o autor não é uma pessoa.'
      required: [at, by]
      properties:
        at: { type: string, format: date-time }
        by: { type: string, nullable: true }
    OrganizationUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        color: { type: string, nullable: true, description: '#RRGGBB; vazio ou nulo limpa.' }
        holderDocument: { type: string, nullable: true, description: 'CPF ou CNPJ, com ou sem máscara; vazio ou nulo limpa.' }
    UnitDeactivationCheck:
      type: object
      required: [activeStudents, activeClasses, lastActiveUnit, canDeactivate]
      properties:
        activeStudents: { type: integer, minimum: 0 }
        activeClasses: { type: integer, minimum: 0 }
        lastActiveUnit: { type: boolean }
        canDeactivate: { type: boolean }
    Modality:
      type: object
      required: [id, name, active, canManage, graduationEnabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        canManage: { type: boolean }
        graduationEnabled: { type: boolean }
    UnitModality:
      type: object
      required: [id, name, offered]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        offered: { type: boolean }
    UnitModalities:
      type: object
      required: [canManage, items]
      properties:
        canManage: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/UnitModality' } }
    GraduationLevel:
      type: object
      required: [id, name, color, secondaryColor, maxDegree, minAge, maxAge, kids]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        secondaryColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', nullable: true }
        maxDegree: { type: integer, minimum: 0, maximum: 10 }
        minAge: { type: integer, minimum: 0, maximum: 120, nullable: true }
        maxAge: { type: integer, minimum: 0, maximum: 120, nullable: true }
        kids: { type: boolean }
    Graduation:
      type: object
      required: [enabled, requireOriginProof, canManage, levels]
      properties:
        enabled: { type: boolean }
        requireOriginProof: { type: boolean }
        canManage: { type: boolean }
        levels: { type: array, items: { $ref: '#/components/schemas/GraduationLevel' } }
    GraduationUpdate:
      type: object
      required: [enabled, levels]
      properties:
        enabled: { type: boolean }
        requireOriginProof: { type: boolean, default: false }
        levels:
          type: array
          maxItems: 30
          items:
            type: object
            required: [name, color, maxDegree, kids]
            properties:
              id: { type: string, format: uuid, description: 'Presente para atualizar um nível existente; ausente cria.' }
              name: { type: string, minLength: 1, maxLength: 40 }
              color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
              secondaryColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', nullable: true }
              maxDegree: { type: integer, minimum: 0, maximum: 10 }
              minAge: { type: integer, minimum: 0, maximum: 120, nullable: true }
              maxAge: { type: integer, minimum: 0, maximum: 120, nullable: true }
              kids: { type: boolean }
    ModalityRequest:
      type: object
      required: [id, name, note, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        note: { type: string, nullable: true }
        status: { type: string, enum: [OPEN, ADDED, DISMISSED] }
        createdAt: { type: string, format: date-time }
    AgeRange:
      type: object
      required: [id, name, minAge, maxAge]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 40 }
        minAge: { type: integer, minimum: 0, maximum: 120 }
        maxAge: { type: integer, minimum: 0, maximum: 120, nullable: true, description: Nulo = sem limite. }
    AgeRangeBody:
      type: object
      required: [name, minAge]
      properties:
        name: { type: string, minLength: 2, maxLength: 40 }
        minAge: { type: integer, minimum: 0, maximum: 120 }
        maxAge: { type: integer, minimum: 0, maximum: 120, nullable: true }
    AgeRangeList:
      type: object
      required: [canManage, items]
      properties:
        canManage: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/AgeRange' } }
    TeacherRow:
      type: object
      required: [id, name, photoUrl, modalities, units, classCount, status, directoryConsent, access]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        photoUrl: { type: string, nullable: true, description: URL temporária assinada; nulo sem foto. }
        modalities:
          type: array
          items:
            type: object
            required: [id, name, levelId, level, degree]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              levelId: { type: string, format: uuid, nullable: true }
              level: { type: string, nullable: true, description: Nível de graduação no sistema da organização. }
              degree: { type: integer, nullable: true, minimum: 0, maximum: 10 }
        units:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        classCount: { type: integer, minimum: 0 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        directoryConsent: { type: boolean }
        access: { type: string, enum: [NONE, PENDING, ACTIVE, ENDED], description: Estado do vínculo TEACHER da conta; NONE sem conta ou sem vínculo. }
    ClassRow:
      type: object
      required: [id, name, unit, modality, ageRange, schedule, head, assistants, activeStudents, capacity, overCapacity, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        unit: { $ref: '#/components/schemas/ClassRef' }
        modality: { $ref: '#/components/schemas/ClassRef' }
        ageRange:
          type: object
          nullable: true
          required: [id, name, minAge, maxAge]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            minAge: { type: integer }
            maxAge: { type: integer, nullable: true }
        schedule:
          type: array
          description: Um horário por dia da semana, ordenado por dia (1 segunda a 7 domingo); horas de parede da unidade (`HH:mm`).
          items:
            type: object
            required: [weekday, startsAt, endsAt]
            properties:
              weekday: { type: integer, minimum: 1, maximum: 7 }
              startsAt: { type: string, example: '19:00' }
              endsAt: { type: string, example: '20:00' }
        head: { $ref: '#/components/schemas/ClassRef' }
        assistants: { type: array, items: { $ref: '#/components/schemas/ClassRef' } }
        activeStudents: { type: integer, minimum: 0 }
        capacity: { type: integer, minimum: 1, maximum: 200, nullable: true }
        overCapacity: { type: boolean, description: Verdadeiro quando `activeStudents` passa de `capacity`; só avisa. }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    Agenda:
      type: object
      required: [units, unit, teachers, modalities, lessons, noClassDays]
      properties:
        units: { type: array, items: { $ref: '#/components/schemas/ClassRef' }, description: Unidades ativas do alcance. }
        unit: { allOf: [{ $ref: '#/components/schemas/ClassRef' }], nullable: true, description: A unidade escolhida; nula se o alcance não tem unidade. }
        teachers: { type: array, items: { $ref: '#/components/schemas/ClassRef' }, description: Professores ativos da unidade (opções de filtro). }
        modalities: { type: array, items: { $ref: '#/components/schemas/ClassRef' }, description: Modalidades oferecidas pela unidade (opções de filtro). }
        lessons: { type: array, items: { $ref: '#/components/schemas/AgendaLesson' } }
        noClassDays: { type: array, items: { $ref: '#/components/schemas/NoClassDay' } }
    AgendaLesson:
      type: object
      required: [id, date, startsAt, endsAt, status, cancelReason, cancelReasonCode, class, title, unit, modality, teacher, substitute, canEdit, canCancel]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        startsAt: { type: string, example: '19:00' }
        endsAt: { type: string, example: '20:00' }
        status: { type: string, enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED] }
        cancelReason: { type: string, nullable: true, description: Só quando `CANCELLED`. }
        cancelReasonCode: { type: string, nullable: true, enum: [TEACHER_UNAVAILABLE, HOLIDAY, ACADEMY_EVENT, OTHER], description: 'Só quando `CANCELLED`; nulo na aula cancelada por dia sem aula (o texto vem em `cancelReason`).' }
        class: { allOf: [{ $ref: '#/components/schemas/ClassRef' }], nullable: true, description: Nula na aula avulsa. }
        title: { type: string, nullable: true, description: Título da aula avulsa; nulo na aula de turma. }
        unit: { $ref: '#/components/schemas/ClassRef' }
        modality: { $ref: '#/components/schemas/ClassRef' }
        teacher: { $ref: '#/components/schemas/ClassRef', description: Professor da aula. }
        substitute: { type: boolean }
        canEdit: { type: boolean }
        canCancel: { type: boolean }
    LessonDetail:
      type: object
      required: [id, date, startsAt, endsAt, status, cancelReason, cancelReasonCode, class, title, visibilityClass, unit, modality, teacher, head, substitute, activeStudents, trialClasses, groupLink, canEdit, canCancel, canViewClass, followingEdited]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        startsAt: { type: string, example: '19:00' }
        endsAt: { type: string, example: '20:00' }
        status: { type: string, enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED] }
        cancelReason: { type: string, nullable: true, description: Só quando `CANCELLED`. }
        cancelReasonCode: { type: string, nullable: true, enum: [TEACHER_UNAVAILABLE, HOLIDAY, ACADEMY_EVENT, OTHER], description: 'Só quando `CANCELLED`; nulo na aula cancelada por dia sem aula (o texto vem em `cancelReason`).' }
        class: { allOf: [{ $ref: '#/components/schemas/ClassRef' }], nullable: true, description: Nula na aula avulsa. }
        title: { type: string, nullable: true, description: Título da aula avulsa; nulo na aula de turma. }
        visibilityClass: { allOf: [{ $ref: '#/components/schemas/ClassRef' }], nullable: true, description: Turma que vê a aula avulsa no portal; nula = todas as turmas da unidade. }
        unit: { $ref: '#/components/schemas/ClassRef' }
        modality: { $ref: '#/components/schemas/ClassRef' }
        teacher: { $ref: '#/components/schemas/ClassRef', description: Professor da aula. }
        head: { allOf: [{ $ref: '#/components/schemas/ClassRef' }], nullable: true, description: Titular da turma; só na substituição. }
        substitute: { type: boolean }
        activeStudents: { type: integer, minimum: 0 }
        trialClasses: { type: integer, minimum: 0 }
        groupLink: { type: string, nullable: true }
        canEdit: { type: boolean }
        canCancel: { type: boolean }
        canViewClass: { type: boolean, description: Verdadeiro só para quem gerencia turmas (`CLASSES_MANAGE`). }
        followingEdited: { type: integer, minimum: 0, description: "Aulas seguintes da turma, ainda agendadas, alteradas à mão ou com substituto gravado, que editar \"esta e as seguintes\" (RN-AGE-04) atingiria: data e horário mudam, e as com substituto mantêm o substituto; 0 na aula avulsa." }
    LessonCreateInput:
      type: object
      required: [unitId, title, modalityId, date, startsAt, endsAt, teacherId]
      properties:
        unitId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 80 }
        modalityId: { type: string, format: uuid }
        date: { type: string, format: date }
        startsAt: { type: string, example: '10:00' }
        endsAt: { type: string, example: '11:30' }
        teacherId: { type: string, format: uuid }
        visibilityClassId: { type: string, format: uuid, nullable: true, description: Turma ativa da unidade; ausente ou nula = todas as turmas. }
    LessonEditInput:
      type: object
      required: [scope, date, startsAt, endsAt, teacherId]
      properties:
        scope: { type: string, enum: [THIS, FOLLOWING] }
        date: { type: string, format: date }
        startsAt: { type: string, example: '19:00' }
        endsAt: { type: string, example: '20:00' }
        teacherId: { type: string, format: uuid }
        reason: { type: string, maxLength: 200, description: Obrigatório para aula concluída. }
    LessonCancelInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, enum: [TEACHER_UNAVAILABLE, HOLIDAY, ACADEMY_EVENT, OTHER] }
        reasonText: { type: string, maxLength: 200, description: Obrigatório em `OTHER`; ignorado nos demais. }
        channels: { type: array, items: { type: string, enum: [EMAIL, WHATSAPP] } }
        trialDecision: { type: string, enum: [REBOOK, CANCEL_TRIALS], description: Obrigatório se a aula tem experimental marcada. }
    NoClassDay:
      type: object
      required: [startsOn, endsOn, reason]
      properties:
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        reason: { type: string }
    NoClassDayNoticeInput:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [NONE, NOW, SCHEDULED] }
        sendAt: { type: string, format: date-time, description: Obrigatório em `SCHEDULED`; futuro e antes do início do dia. }
    NoClassDayInput:
      type: object
      required: [unitIds, startsOn, endsOn, reason]
      properties:
        unitIds: { type: array, items: { type: string, format: uuid }, description: Uma unidade (Administrador) ou várias (Coordenador). Ignorado na edição. }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        reason: { type: string, minLength: 1, maxLength: 120 }
        holiday: { type: boolean, description: Verdadeiro ao confirmar feriado sugerido; origem `HOLIDAY`. }
        classIds: { type: array, items: { type: string, format: uuid }, description: Vazio ou ausente = todas as turmas. }
        notice: { $ref: '#/components/schemas/NoClassDayNoticeInput' }
    NoClassDayNotice:
      type: object
      required: [mode, sendAt, status]
      properties:
