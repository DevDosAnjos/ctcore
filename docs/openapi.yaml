        status: { type: string, enum: [OPEN, ADDED, DISMISSED] }
        createdAt: { type: string, format: date-time }
    AgeRange:
      type: object
      required: [id, name, minAge, maxAge]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 40 }
        minAge: { type: integer, minimum: 0, maximum: 120 }
        maxAge: { type: integer, minimum: 0, maximum: 120, nullable: true, description: Nulo = sem limite. }
    AgeRangeBody:
      type: object
      required: [name, minAge]
      properties:
        name: { type: string, minLength: 2, maxLength: 40 }
        minAge: { type: integer, minimum: 0, maximum: 120 }
        maxAge: { type: integer, minimum: 0, maximum: 120, nullable: true }
    AgeRangeList:
      type: object
      required: [canManage, items]
      properties:
        canManage: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/AgeRange' } }
    TermsKind:
      type: string
      enum: [ENROLLMENT, IMAGE_USE]
    TermsVersion:
      type: object
      required: [version, body, reaccept, publishedAt, publishedBy]
      properties:
        version: { type: integer, minimum: 0, description: '0 é o texto padrão da plataforma, sem publicação.' }
        body: { type: string }
        reaccept: { type: boolean, description: Verdadeiro quando todos aceitam de novo no próximo acesso. }
        publishedAt: { type: string, format: date-time, nullable: true }
        publishedBy: { type: string, nullable: true }
    TermsView:
      type: object
      required: [canManage, current, versions]
      properties:
        canManage: { type: boolean }
        current: { $ref: '#/components/schemas/TermsVersion' }
        versions: { type: array, items: { $ref: '#/components/schemas/TermsVersion' } }
    TermsPublishInput:
      type: object
      required: [body, reaccept]
      properties:
        body: { type: string, minLength: 20, maxLength: 20000 }
        reaccept: { type: boolean }
    PaymentInput:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [CASH, PIX_KEY, CARD_MACHINE, TRANSFER] }
        paidAt: { type: string, format: date-time, description: 'Padrão agora; não pode ser futuro.' }
        observation: { type: string, maxLength: 200 }
        amountCents: { type: integer, format: int64, description: 'Se vier, tem de ser igual ao valor da cobrança (senão 422).' }
        sendReceipt: { type: boolean, default: false, description: 'Envia o recibo por e-mail ao pagador.' }
    ReceiptRef:
      type: object
      required: [number, code]
      properties:
        number: { type: integer, minimum: 1, description: 'Sequencial da unidade, sem lacunas.' }
        code: { type: string, minLength: 16, maxLength: 16, description: Código de conferência. }
    Payment:
      type: object
      required: [id, chargeId, amountCents, method, paidAt, registeredBy, observation, receipt, receiptEmail]
      properties:
        id: { type: string, format: uuid }
        chargeId: { type: string, format: uuid }
        amountCents: { type: integer, format: int64 }
        method: { type: string, enum: [CASH, PIX_KEY, CARD_MACHINE, TRANSFER] }
        paidAt: { type: string, format: date-time }
        registeredBy: { type: string, format: uuid }
        observation: { type: string, nullable: true }
        receipt: { $ref: '#/components/schemas/ReceiptRef' }
        receiptEmail: { type: string, enum: [SENT, NO_ADDRESS, NOT_REQUESTED, FAILED], description: 'SENT: mensagem entregue ou guardada; NO_ADDRESS: pagador sem e-mail; NOT_REQUESTED: sendReceipt falso; FAILED: o envio não saiu (nova tentativa automática).' }
    PublicReceipt:
      type: object
      required: [unit, number, reference, amountCents, paidAt, payerInitials]
      properties:
        unit: { type: string }
        number: { type: integer, minimum: 1 }
        reference: { type: string, description: '"Jiu-Jitsu · nov/2026" na mensalidade; a descrição nos demais tipos.' }
        amountCents: { type: integer, format: int64 }
        paidAt: { type: string, format: date-time }
        payerInitials: { type: string, example: M. S. }
    AdvanceInput:
      type: object
      required: [count]
      properties:
        count: { type: integer, minimum: 1, maximum: 12 }
    OneOffInput:
      type: object
      required: [unitId, description, amountCents, dueOn]
      properties:
        requestId: { type: string, format: uuid, description: 'Vira o id da cobrança; reenviar o mesmo pedido não duplica.' }
        unitId: { type: string, format: uuid }
        description: { type: string, minLength: 1, maxLength: 80, example: Kimono A2 }
        amountCents: { type: integer, format: int64, minimum: 1, maximum: 10000000, example: 25000 }
        dueOn: { type: string, format: date, description: 'Hoje ou depois, no fuso da unidade.' }
    ChargeCreated:
      type: object
      required: [id, modalityRowId, type, unitId, referenceMonth, dueOn, toleranceDays, amountCents]
      properties:
        id: { type: string, format: uuid }
        modalityRowId: { type: string, format: uuid }
        type: { type: string, enum: [MONTHLY] }
        unitId: { type: string, format: uuid }
        referenceMonth: { type: string, format: date, description: Primeiro dia do mês de referência. }
        dueOn: { type: string, format: date }
        toleranceDays: { type: integer }
        amountCents: { type: integer, format: int64 }
    ChangeNextDueInput:
      type: object
      required: [dueOn]
      properties:
        dueOn: { type: string, format: date }
    NextChargeAdjusted:
      type: object
      required: [dueOn, referenceMonth]
      properties:
        dueOn: { type: string, format: date }
        referenceMonth: { type: string, format: date }
    CancelNextInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 200 }
        referenceMonth: { type: string, format: date, description: 'Mês que a tela mostrou; se o ponteiro já andou, 409.' }
    NextChargeCanceled:
      type: object
      required: [chargeId, referenceMonth]
      properties:
        chargeId: { type: string, format: uuid }
        referenceMonth: { type: string, format: date }
    GenerationPreviewLine:
      type: object
      required: [studentId, student, modalityRowId, modality, plan, discountCents, amountCents, referenceMonth, adjustable]
      properties:
        studentId: { type: string, format: uuid }
        student: { type: string }
        modalityRowId: { type: string, format: uuid }
        modality: { type: string }
        plan: { type: string }
        discountCents: { type: integer, format: int64 }
        amountCents: { type: integer, format: int64 }
        referenceMonth: { type: string, format: date }
        adjustable: { type: boolean, description: 'Verdadeiro só para a primeira mensalidade ainda não gerada da modalidade (a que o ponteiro aponta).' }
    GenerationPreview:
      type: object
      required: [until, days, count, totalCents, previousMonthTotalCents, skipped]
      properties:
        until: { type: string, format: date }
        days:
          type: array
          items:
            type: object
            required: [dueOn, count, totalCents, lines]
            properties:
              dueOn: { type: string, format: date }
              count: { type: integer }
              totalCents: { type: integer, format: int64 }
              lines: { type: array, items: { $ref: '#/components/schemas/GenerationPreviewLine' } }
        count: { type: integer }
        totalCents: { type: integer, format: int64 }
        previousMonthTotalCents: { type: integer, format: int64, description: 'Mensalidades (não canceladas) do mês anterior ao primeiro vencimento previsto.' }
        skipped:
          type: array
          items:
            type: object
            required: [studentId, student, modality, referenceMonth, reason]
            properties:
              studentId: { type: string, format: uuid }
              student: { type: string }
              modality: { type: string }
              referenceMonth: { type: string, format: date }
              reason: { type: string, enum: [FULL_BENEFIT] }
    DailyReceiptsPerson:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    DailyReceipts:
      type: object
      required: [date, totalCents, count, byMethod, byRegistrar, payments]
      properties:
        date: { type: string, format: date }
        totalCents: { type: integer, format: int64 }
        count: { type: integer }
        byMethod:
          type: array
          items:
            type: object
            required: [method, count, totalCents]
            properties:
              method: { type: string, enum: [PIX_MP, CREDIT_CARD, DEBIT_CARD, BOLETO, PIX_KEY, CASH, CARD_MACHINE, TRANSFER] }
              count: { type: integer }
              totalCents: { type: integer, format: int64 }
        byRegistrar:
          type: array
          items:
            type: object
            required: [registeredBy, count, totalCents]
            properties:
              registeredBy: { allOf: [{ $ref: '#/components/schemas/DailyReceiptsPerson' }], nullable: true, description: 'Nulo: pagamento sem lançador (portal, débito automático).' }
              count: { type: integer }
              totalCents: { type: integer, format: int64 }
        payments:
          type: array
          items:
            type: object
            required: [id, paidAt, student, reference, method, registeredBy, amountCents, receiptNumber]
            properties:
              id: { type: string, format: uuid }
              paidAt: { type: string, format: date-time }
              student: { $ref: '#/components/schemas/DailyReceiptsPerson' }
              reference: { type: string, description: 'Modalidade e mês, ou a descrição da cobrança avulsa.' }
              method: { type: string, enum: [PIX_MP, CREDIT_CARD, DEBIT_CARD, BOLETO, PIX_KEY, CASH, CARD_MACHINE, TRANSFER] }
              registeredBy: { allOf: [{ $ref: '#/components/schemas/DailyReceiptsPerson' }], nullable: true }
              amountCents: { type: integer, format: int64 }
              receiptNumber: { type: integer }
    TeacherRow:
      type: object
      required: [id, name, photoUrl, modalities, units, classCount, status, directoryConsent, access]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        photoUrl: { type: string, nullable: true, description: URL temporária assinada; nulo sem foto. }
        modalities:
          type: array
          items:
            type: object
            required: [id, name, levelId, level, degree]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              levelId: { type: string, format: uuid, nullable: true }
