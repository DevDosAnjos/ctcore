tyle="display: flex; align-items: center; justify-content: flex-start; gap: 10px;"><span style="width: 24px; height: 24px; border-radius: 50%; background: #ECE9E2; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">2</span><span>Escolha "Adicionar à tela inicial".</span></div><div style="display: flex; align-items: center; justify-content: flex-start; gap: 10px;"><span style="width: 24px; height: 24px; border-radius: 50%; background: #ECE9E2; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">3</span><span>Abra pelo ícone: a carteirinha funciona até sem internet.</span></div></div><button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 8px; border: 1px solid #1B1B1F; background: #1B1B1F; color: #FFFFFF; font-size: 15px; font-weight: 500; white-space: nowrap; text-decoration: none; width: 100%; cursor: pointer">Adicionar à tela inicial</button><button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: #1B1B1F; font-size: 14px; font-weight: 500; white-space: nowrap; text-decoration: none; width: 100%; cursor: pointer">Agora não</button></section></div><span style="font-size: 11px; color: #8C877D; text-align: center">feito com ctcore</span></div><div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 10"></div></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 780}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const G = {};
    const on = {}, pick = {}, sty = {};
    Object.keys(G).forEach((g) => {
      const cur = st[g] !== undefined ? st[g] : G[g][0];
      G[g][1].forEach((o) => {
        const k = g + '_' + o;
        on[k] = cur === o;
        sty[k] = cur === o ? G[g][2] : G[g][3];
        pick[k] = () => this.setState({ [g]: o });
      });
    });
    return { on: on, pick: pick, sty: sty };
  }
}
</script>
