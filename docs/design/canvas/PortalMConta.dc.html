<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 1000}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const G = {};
    const on = {}, pick = {}, sty = {};
    Object.keys(G).forEach((g) => {
      const cur = st[g] !== undefined ? st[g] : G[g][0];
      G[g][1].forEach((o) => {
        const k = g + '_' + o;
        on[k] = cur === o;
        sty[k] = cur === o ? G[g][2] : G[g][3];
        pick[k] = () => this.setState({ [g]: o });
      });
    });
    return { on: on, pick: pick, sty: sty };
  }
}
</script>
