<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">

body{margin:0;background:#F4F2ED}
*{box-sizing:border-box}
a{color:#1B1B1F;text-decoration:none}a:hover{color:#B23C24}
button,input,select,textarea{font-family:inherit}
</style>

<div style="min-height: 100vh; background: #F4F2ED; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1B1B1F"><header style="height: 64px; background: #C8462C; color: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 16px"><span style="width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700">AL</span><span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 20px; text-transform: uppercase">Academia Leão</span><span style="font-size: 12px; opacity: 0.85">Tijuca</span></header><div style="padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 14px"><h1 style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 0.98; text-transform: uppercase; letter-spacing: 0.01em">Este link não está disponível</h1><p style="margin: 0; font-size: 15px; line-height: 1.5; color: #6B675F;">A Academia Leão · Tijuca não está recebendo pedidos por aqui no momento. Fale com a unidade pelo WhatsApp.</p><button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #B9DCC3; background: #EAF5EC; color: #1D5E34; font-size: 14px; font-weight: 500; white-space: nowrap; text-decoration: none; width: 100%; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M4.5 19.5 5.6 16A7.8 7.8 0 1 1 8.4 18.6z"></path><path d="M9.2 9.3c.3 1.9 2.1 3.9 4.6 4.7l1.1-1.1 1.6.8-.4 1.5c-3.5.4-7.1-3.2-6.9-6.6l1.5-.4.8 1.6z"></path></svg>WhatsApp da unidade</button></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 780}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const G = {};
    const on = {}, pick = {}, sty = {};
    Object.keys(G).forEach((g) => {
      const cur = st[g] !== undefined ? st[g] : G[g][0];
      G[g][1].forEach((o) => {
        const k = g + '_' + o;
        on[k] = cur === o;
        sty[k] = cur === o ? G[g][2] : G[g][3];
        pick[k] = () => this.setState({ [g]: o });
      });
    });
    return { on: on, pick: pick, sty: sty };
  }
}
</script>
</body>
</html>
