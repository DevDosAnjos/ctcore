<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Portal › Barra superior (celular)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F2ED}
*{box-sizing:border-box}
a{color:#1B1B1F;text-decoration:none}a:hover{color:#B23C24}
button,input,select,textarea{font-family:inherit}
</style>
</helmet>
<header style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; background: #1B1B1F; color: #FFFFFF; font-family: 'IBM Plex Sans', system-ui, sans-serif"><span style="width: 30px; height: 30px; border-radius: 8px; background: #C8462C; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 15px">AL</span><span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 18px; text-transform: uppercase; letter-spacing: 0.04em; flex-grow: 1">Academia Leão</span><a href="PortalMAvisos.dc.html" aria-label="Avisos" style="position: relative; display: flex; width: 40px; height: 40px; align-items: center; justify-content: center; color: #D8D4CB"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2.2 2.2 0 0 0 4 0"></path></svg><span style="position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; border-radius: 999px; background: #C8462C; color: #FFFFFF; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center">2</span></a><span style="width: 32px; height: 32px; border-radius: 50%; background: {{cor}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">{{ini}}</span></header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"perfil": {"editor": "enum", "options": ["aluno", "responsavel"], "default": "aluno"}, "$preview": {"width": 390, "height": 780}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props.perfil ?? 'aluno';
    const P = { aluno: ['BC', '#6B3FA0'], responsavel: ['AN', '#3D5A80'] };
    const x = P[p] || P.aluno;
    return { ini: x[0], cor: x[1] };
  }
}
</script>
</body>
</html>
