<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const G = {"per": [3, [0, 1, 2, 3, 4, 5, 6], "display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; border: 1px solid #1B1B1F; background: #1B1B1F; color: #FFFFFF; white-space: nowrap; cursor: pointer", "display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; border: 1px solid #D9D4C9; background: #FFFFFF; color: #1B1B1F; white-space: nowrap; cursor: pointer"]};
    const on = {}, pick = {}, sty = {};
    Object.keys(G).forEach((g) => {
      const cur = st[g] !== undefined ? st[g] : G[g][0];
      G[g][1].forEach((o) => {
        const k = g + '_' + o;
        on[k] = cur === o;
        sty[k] = cur === o ? G[g][2] : G[g][3];
        pick[k] = () => this.setState({ [g]: o });
      });
    });
    return { on: on, pick: pick, sty: sty };
  }
}
