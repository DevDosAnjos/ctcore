<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Navegação do portal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F2ED}
*{box-sizing:border-box}
a{color:#1B1B1F;text-decoration:none}a:hover{color:#B23C24}
button,input,select,textarea{font-family:inherit}
</style>
</helmet>
<header style="height: 64px; background: #1B1B1F; color: #FFFFFF; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px"><div style="max-width: 1120px; height: 100%; margin: 0 auto; display: flex; align-items: center; gap: 28px"><a href="PortalInicio.dc.html" style="display: flex; align-items: center; gap: 10px; color: #FFFFFF"><span style="width: 32px; height: 32px; border-radius: 8px; background: #C8462C; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 16px">AL</span><span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase">Academia Leão</span></a><nav aria-label="Portal" style="display: flex; align-items: stretch; height: 100%; gap: 4px; flex-grow: 1"><sc-if value="{{vis.inicio}}" hint-placeholder-val="{{ true }}"><a href="PortalInicio.dc.html" style="{{st.inicio}}">Início</a></sc-if><sc-if value="{{vis.agenda}}" hint-placeholder-val="{{ true }}"><a href="PortalAgenda.dc.html" style="{{st.agenda}}">Agenda</a></sc-if><sc-if value="{{vis.financeiro}}" hint-placeholder-val="{{ true }}"><a href="PortalFinanceiro.dc.html" style="{{st.financeiro}}">Financeiro</a></sc-if><sc-if value="{{vis.avisos}}" hint-placeholder-val="{{ true }}"><a href="PortalAvisos.dc.html" style="{{st.avisos}}">Avisos<span style="margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #C8462C; color: #FFFFFF; font-size: 11px; display: inline-flex; align-items: center; justify-content: center">2</span></a></sc-if><sc-if value="{{vis.info}}" hint-placeholder-val="{{ true }}"><a href="PortalInfo.dc.html" style="{{st.info}}">Minhas informações</a></sc-if></nav><button type="button" aria-label="Trocar tema" style="display: flex; width: 36px; height: 36px; align-items: center; justify-content: center; border: 0; background: transparent; color: #D8D4CB; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></button><a href="PortalAvisos.dc.html" aria-label="Avisos não lidos: 2" style="position: relative; display: flex; color: #D8D4CB"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2.2 2.2 0 0 0 4 0"></path></svg><span style="position: absolute; top: -4px; right: -6px; min-width: 16px; height: 16px; border-radius: 999px; background: #C8462C; color: #FFFFFF; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center">2</span></a><span style="width: 1px; height: 24px; background: #3A3A40"></span><a href="PortalConta.dc.html" style="display: flex; align-items: center; gap: 10px; color: #FFFFFF"><span style="width: 32px; height: 32px; border-radius: 50%; background: {{cor}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">{{ini}}</span><span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-size: 13px; font-weight: 500">{{nome}}</span><span style="font-size: 12px; color: #A9A49A">{{papel}}</span></span></a></div></header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"aba": {"editor": "enum", "options": ["inicio", "agenda", "financeiro", "avisos", "info"], "default": "inicio"}, "perfil": {"editor": "enum", "options": ["aluno", "responsavel", "ok", "inativo"], "default": "aluno"}, "$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
  renderVals() {
    const aba = this.props.aba ?? 'inicio';
    const perfil = this.props.perfil ?? 'aluno';
    const P = { aluno: ['Bruno Carvalho', 'Aluno', 'BC', '#6B3FA0'], responsavel: ['Ana Paula Nogueira', 'Responsável', 'AN', '#3D5A80'], ok: ['Marina Teixeira', 'Aluna', 'MT', '#9C2F18'], inativo: ['Gabriel Rocha', 'Aluno · Inativo', 'GR', '#9C2F18'] };
    const p = P[perfil] || P.aluno;
    const keys = ["inicio", "agenda", "financeiro", "avisos", "info"];
    const st = {}, vis = {};
    keys.forEach((k) => {
      const on = k === aba;
      st[k] = 'display:flex;align-items:center;padding:0 14px;font-size:14px;text-decoration:none;border-bottom:3px solid ' + (on ? '#C8462C' : 'transparent') + ';color:' + (on ? '#FFFFFF' : '#A9A49A') + ';font-weight:' + (on ? '600' : '500');
      vis[k] = perfil === 'inativo' ? (k === 'financeiro' || k === 'info') : true;
    });
    return { st: st, vis: vis, nome: p[0], papel: p[1], ini: p[2], cor: p[3] };
  }
}
</script>
</body>
</html>
