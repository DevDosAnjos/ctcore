spring:
  application:
    name: ctcore
  datasource:
    # Padrões iguais aos de infra/docker-compose.yml; em produção vêm só de variável de ambiente.
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ctcore}
    username: ${POSTGRES_USER:ctcore}
    password: ${POSTGRES_PASSWORD:ctcore_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # Mesmo nome do contrato (docs/openapi.yaml, sessionCookie); o padrão JSESSIONID denuncia a tecnologia.
        name: SESSION
        http-only: true
        secure: true
        same-site: lax

ctcore:
  security:
    require-https: true
  # D2: simulated (padrão) ou off por conexão; real só depois das Sprints 22 e 23.
  integrations:
    payment:
      mode: simulated
    email:
      mode: simulated
    sms:
      mode: simulated
    push:
      mode: simulated
    challenge:
      mode: simulated
    map:
      mode: simulated
    metrics:
      mode: simulated

logging:
  # D1/D2: JSON em console e arquivo, em todos os ambientes; mascaramento em SensitiveDataMasker (D3).
  structured:
    format:
      console: logstash
      file: logstash
    json:
      customizer: br.com.ctcore.logging.SensitiveDataMasker
  file:
    name: ${LOG_DIR:logs}/ctcore.log
  logback:
    rollingpolicy:
      # D4: rotação diária e guarda de 30 dias (RNF-11).
      file-name-pattern: ${LOG_DIR:logs}/ctcore-%d{yyyy-MM-dd}.%i.log.gz
      max-history: 30
      max-file-size: 100MB

management:
  # D8: porta de gestão própria, não publicada para a internet.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      validate-group-membership: false
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
