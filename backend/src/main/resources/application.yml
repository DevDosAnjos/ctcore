spring:
  application:
    name: ctcore
  datasource:
    # Padrões iguais aos de infra/docker-compose.yml; em produção vêm só de variável de ambiente.
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ctcore}
    username: ${DB_RUNTIME_USER:ctcore_app}
    password: ${DB_RUNTIME_PASSWORD:ctcore_app_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    url: ${spring.datasource.url}
    user: ${DB_MIGRATION_USER:${POSTGRES_USER:ctcore}}
    password: ${DB_MIGRATION_PASSWORD:${POSTGRES_PASSWORD:ctcore_dev}}
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # Mesmo nome do contrato (docs/openapi.yaml, sessionCookie); o padrão JSESSIONID denuncia a tecnologia.
        name: SESSION
        http-only: true
        secure: true
        same-site: lax

ctcore:
  app:
    # Base dos links enviados por e-mail (convite, nova senha).
    base-url: ${APP_BASE_URL:http://localhost:5173}
  email:
    # D2 (#19): 5 tentativas no total; espera entre elas após a 1ª, 2ª, 3ª e 4ª falha.
    max-attempts: 5
    backoff: 1m,5m,30m,2h
  security:
    require-https: true
    # D4 (#18): 5 senhas erradas seguidas travam o e-mail por 15 minutos; 20 falhas por IP na mesma janela.
    login:
      max-failures: 5
      lockout: 15m
      ip-max-failures: 20
      reset-max-per-email: 5
  # D5: padrões iguais aos de infra/docker-compose.yml; em produção vêm só de variável de ambiente.
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:${STORAGE_PORT:8333}}
    bucket: ${STORAGE_BUCKET:ctcore}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:dev}
    secret-key: ${STORAGE_SECRET_KEY:dev-secret}
    url-expiry: ${STORAGE_URL_EXPIRY:5m}
  # D2: simulated (padrão) ou off por conexão; real só depois das Sprints 22 e 23.
  integrations:
    payment:
      mode: simulated
    email:
      mode: simulated
    sms:
      mode: simulated
    push:
      mode: simulated
    challenge:
      mode: simulated
    map:
      mode: simulated
    metrics:
      mode: simulated

logging:
  # D1/D2: JSON em console e arquivo, em todos os ambientes; mascaramento em SensitiveDataMasker (D3).
  structured:
    format:
      console: logstash
      file: logstash
    json:
      customizer: br.com.ctcore.logging.SensitiveDataMasker
  file:
    name: ${LOG_DIR:logs}/ctcore.log
  logback:
    rollingpolicy:
      # D4: rotação diária e guarda de 30 dias (RNF-11).
      file-name-pattern: ${LOG_DIR:logs}/ctcore-%d{yyyy-MM-dd}.%i.log.gz
      max-history: 30
      max-file-size: 100MB

management:
  # D8: porta de gestão própria, não publicada para a internet.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      validate-group-membership: false
      group:
        readiness:
          include: readinessState,db
  metrics:
    enable:
      # disk.free/disk.total trazem o caminho de instalação como etiqueta; não expor na porta de gestão.
      disk: false
    distribution:
      percentiles-histogram:
        http.server.requests: true
