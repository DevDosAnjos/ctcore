# Esteira de CI (RNF-35, RNF-36, RNF-37). Roda em todo PR para dev e main.
# Seleção por pasta em infra/scripts/changed-areas.sh; `ci-gate` é o único status a exigir na proteção de branch.
name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: areas
        run: bash infra/scripts/changed-areas.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" "${{ github.base_ref }}" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # build + *Test + *IT (Testcontainers) + contrato OpenAPI + cobertura JaCoCo (80% / 100%)
      - run: ./mvnw -B verify
        working-directory: backend
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Vitest com axe nos dois temas, contrato MSW e cobertura (80% / 100%)
      - run: npm run test:cov
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # a tag da imagem acompanha @playwright/test do lockfile; ao atualizar um, atualize o outro
      - name: Conferir versão do Playwright (lockfile x imagem)
        run: |
          lock=$(node -p "require('@playwright/test/package.json').version")
          img=$(sed -nE 's/^ *image: mcr\.microsoft\.com\/playwright:v([0-9.]+)-.*/\1/p' "$GITHUB_WORKSPACE/.github/workflows/ci.yml" | head -n1)
          [ "$lock" = "$img" ] || { echo "::error::@playwright/test $lock no package-lock.json difere da imagem $img em ci.yml"; exit 1; }
      # @critical em todo PR que muda frontend/; suíte completa no PR para main
      - run: npm run ${{ github.base_ref == 'main' && 'e2e:full' || 'e2e' }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  visual:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      LANG: pt_BR.UTF-8
      LANGUAGE: pt_BR
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # a tag da imagem acompanha @playwright/test do lockfile; ao atualizar um, atualize o outro
      - name: Conferir versão do Playwright (lockfile x imagem)
        run: |
          lock=$(node -p "require('@playwright/test/package.json').version")
          img=$(sed -nE 's/^ *image: mcr\.microsoft\.com\/playwright:v([0-9.]+)-.*/\1/p' "$GITHUB_WORKSPACE/.github/workflows/ci.yml" | head -n1)
          [ "$lock" = "$img" ] || { echo "::error::@playwright/test $lock no package-lock.json difere da imagem $img em ci.yml"; exit 1; }
      # referências geradas só nesta imagem (frontend/README.md, "Teste visual")
      - run: npm run test:visual
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: visual-diff
          path: frontend/test-results
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      OSV_VERSION: v2.7.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Segredos no histórico do PR (gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --verbose --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Prova das regras próprias do gitleaks (.gitleaks.toml)
        run: bash infra/scripts/gitleaks-rules.test.sh ./gitleaks
      - name: Prova do filtro de severidade do OSV
        run: bash infra/scripts/osv-high.test.sh
      - name: Dependências com falha conhecida (OSV-Scanner, severidade alta, crítica ou sem nota)
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x osv-scanner
          code=0
          ./osv-scanner scan source --config osv-scanner.toml -L backend/pom.xml -L frontend/package-lock.json --format json --output-file osv.json || code=$?
          [ "$code" -le 1 ] || { echo "osv-scanner falhou (código $code)"; exit "$code"; }
          # Nota CVSS 7 ou mais, ou sem nota (max_severity vazio), reprova.
          bash infra/scripts/osv-high.sh osv.json

  # Imagens só constroem (sem enviar): o Dockerfile não quebra sem ninguém ver (#11).
  image-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t ctcore-backend backend

  image-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t ctcore-frontend frontend

  ci-gate:
    if: always()
    needs: [changes, backend, frontend, e2e, visual, image-backend, image-frontend, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Cada job exigido precisa de `success` ou `skipped` (pulado por pasta conta como verde);
      # falha, cancelamento ou qualquer outro estado reprova.
      # Resultado vazio ou ausente também reprova (`.result` nulo não é success nem skipped).
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
